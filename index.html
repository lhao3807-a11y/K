  <script>
  (function(){
    const mono = "Consolas,'Courier New',monospace";
    const round1 = x => Math.round(x*10)/10;
    const dirColor = d => d==='bull' ? '#f23645' : d==='bear' ? '#089981' : d==='vol' ? '#f0b90b' : '#8b93a7';

    // ---- 事件集（shot 16 事件为基准 + 补充），人工标注 ----
    const EVENTS = [
      {year:960, title:'陈桥兵变 · 黄袍加身', term:'IPO 上市', dir:'bull', mag:'+大', desc:'赵匡胤黄袍加身，代周建宋，国运指数以发行价 100 点挂牌上市。'},
      {year:979, title:'灭北汉 · 完成统一', term:'跳空高开', dir:'bull', mag:'+大', desc:'太宗灭北汉，中原基本归一，市场情绪亢奋，指数追高超买。'},
      {year:980, title:'高粱河惨败 · 太宗飙驴车', term:'闪崩', dir:'bear', mag:'-大', desc:'攻辽于高粱河大败，太宗股中两箭、乘驴车南逃，指数重挫。（史实为 979 年，为避让上方标注顺移一年）'},
      {year:1004, title:'澶州之战 · 真宗亲征', term:'绝地反击', dir:'bull', mag:'+大', desc:'辽军大举南下，王钦若主张迁都避敌；寇准力促真宗亲征，澶州城下床子弩射杀辽帅萧挞凛，士气大振，指数绝地反击。'},
      {year:1005, title:'澶渊之盟 · 岁币换和平', term:'利好出尽', dir:'bear', mag:'-中', desc:'宋辽约为兄弟之国，换来百年和平，但岁输银十万两、绢二十万匹，长期负担落地，和平红利兑现后指数回吐。'},
      {year:1043, title:'庆历新政 · 范仲淹', term:'改革题材', dir:'vol', mag:'±小', desc:'范仲淹推行新政，整顿吏治触动既得利益，改革题材炒作，波动加大。'},
      {year:1069, title:'王安石变法 · 熙宁新法', term:'多空拉锯', dir:'vol', mag:'±中', desc:'熙宁变法历时十余年，新旧党争反复拉锯，指数高波动、方向不明。'},
      {year:1082, title:'永乐城之败 · 神宗痛哭', term:'见顶回落', dir:'bear', mag:'-大', desc:'大举攻西夏永乐城惨败，士卒伤亡数十万，神宗临朝痛哭，变法成果受挫。国运指数于此见顶，由盛转衰。'},
      {year:1102, title:'徽宗即位 · 蔡京专权', term:'趋势反转', dir:'bear', mag:'-中', desc:'徽宗即位，起用蔡京，立元祐党籍碑、兴花石纲，朝政日坏，指数自高位趋势反转、步入长期下行。'},
      {year:1127, title:'靖康之变 · 二帝北狩', term:'闪崩 -50%', dir:'bear', mag:'-巨', desc:'金兵攻破汴京，徽、钦二帝被掳北去，北宋就此退市，指数腰斩。'},
      {year:1128, title:'南宋建立 · 偏安临安', term:'借壳重组', dir:'neutral', mag:'+小', desc:'赵构南渡称帝，南宋重新挂牌，缩量企稳，进入下半场。'},
      {year:1140, title:'岳飞北伐 · 郾城大捷', term:'强势反弹', dir:'bull', mag:'+大', desc:'岳家军连败金军，兵锋直指故都，指数走出最强劲一波反弹。'},
      {year:1141, title:'绍兴和议 · 岳飞冤死', term:'利空落地', dir:'bear', mag:'-中', desc:'十二道金牌召回，岳飞以“莫须有”遇害，纳贡称臣，指数回吐。'},
      {year:1162, title:'孝宗即位 · 隆兴北伐', term:'题材反弹', dir:'bull', mag:'+小', desc:'孝宗锐意恢复，为岳飞平反，隆兴北伐先胜后败，指数小幅冲高。'},
      {year:1187, title:'乾淳之治 · 南宋鼎盛', term:'慢牛 · 黄金顶', dir:'bull', mag:'+中', desc:'孝宗乾道、淳熙年间南宋鼎盛，经济文化繁荣，指数创历史高位区。'},
      {year:1206, title:'开禧北伐 · 韩侂胄冒进', term:'冲高回落', dir:'bear', mag:'-中', desc:'韩侂胄仓促发动开禧北伐，全线溃败，指数冲高回落。'},
      {year:1234, title:'联蒙灭金 · 引狼入室', term:'利好出尽', dir:'bear', mag:'-中', desc:'与蒙古联手灭金，端平入洛惨败，唇亡齿寒，蒙古旋即大举南侵。'},
      {year:1259, title:'钓鱼城 · 击毙蒙哥', term:'超跌反弹', dir:'bull', mag:'+小', desc:'合州钓鱼城下蒙哥汗殒命，蒙古暂缓南下，指数短线反弹。'},
      {year:1273, title:'襄阳失守 · 门户洞开', term:'破位下跌', dir:'bear', mag:'-大', desc:'襄樊坚守六年终告陷落，长江门户洞开，指数破位下行。'},
      {year:1276, title:'临安陷落 · 恭帝出降', term:'加速赶底', dir:'bear', mag:'-大', desc:'元军入临安，恭帝出降，太皇太后奉玺请降，指数加速探底。'},
      {year:1279, title:'崖山海战 · 负帝投海', term:'摘牌退市', dir:'bear', mag:'-巨', desc:'崖山海战宋军覆灭，陆秀夫负幼帝赵昺投海，宋朝摘牌退市，指数归零。'}
    ];

    // ---- 皇帝在位区间（不重叠、全覆盖 960-1279）----
    const EMPERORS = [
      {name:'太祖', full:'宋太祖 赵匡胤', s:960,  e:976},
      {name:'太宗', full:'宋太宗 赵匡义', s:977,  e:997},
      {name:'真宗', full:'宋真宗 赵恒',   s:998,  e:1022},
      {name:'仁宗', full:'宋仁宗 赵祯',   s:1023, e:1063},
      {name:'英宗', full:'宋英宗 赵曙',   s:1064, e:1067},
      {name:'神宗', full:'宋神宗 赵顼',   s:1068, e:1085},
      {name:'哲宗', full:'宋哲宗 赵煦',   s:1086, e:1100},
      {name:'徽宗', full:'宋徽宗 赵佶',   s:1101, e:1125},
      {name:'钦宗', full:'宋钦宗 赵桓',   s:1126, e:1127},
      {name:'高宗', full:'宋高宗 赵构',   s:1128, e:1161},
      {name:'孝宗', full:'宋孝宗 赵昚',   s:1162, e:1189},
      {name:'光宗', full:'宋光宗 赵惇',   s:1190, e:1194},
      {name:'宁宗', full:'宋宁宗 赵扩',   s:1195, e:1224},
      {name:'理宗', full:'宋理宗 赵昀',   s:1225, e:1264},
      {name:'度宗', full:'宋度宗 赵禥',   s:1265, e:1274},
      {name:'恭帝', full:'宋恭帝 赵㬎',   s:1275, e:1276},
      {name:'端宗', full:'宋端宗 赵昰',   s:1277, e:1278},
      {name:'末帝', full:'宋末帝 赵昺',   s:1279, e:1279}
    ];

    // ---- 锚点（年, 国运指数目标值）----
    // 澶渊段：1000 战云密布下跌 → 1004 亲征绝地反击 → 1005 岁币回吐 → 1022 和平慢牛
    // 见顶段：1069 变法启动 → 1082 永乐城之败钉顶 → 1085 回落 → 1100 趋势反转
    const ANCHORS = [
      [960,100],[979,135],[980,112],[1000,124],[1003,112],[1004,138],[1005,126],[1022,146],
      [1043,178],[1069,186],[1082,222],[1085,204],[1100,168],[1124,150],[1126,70],[1130,90],
      [1140,118],[1142,96],[1165,150],[1187,165],[1207,128],[1234,112],[1259,120],[1272,100],
      [1273,58],[1276,26],[1279,2]
    ];

    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    const rand = mulberry32(9601279);

    function interpOn(list,y){
      if(y<=list[0][0]) return list[0][1];
      for(let i=0;i<list.length-1;i++){
        const a=list[i], b=list[i+1];
        if(y>=a[0] && y<=b[0]){ let t=(y-a[0])/(b[0]-a[0]); t=t*t*(3-2*t); return a[1]+(b[1]-a[1])*t; }
      }
      return list[list.length-1][1];
    }

    // ---- 生成年 K 线 [open, close, low, high] ----
    // 纯实体 K 线：不画上下影线，high/low 收敛到实体两端
    const START=960, END=1279, PEAK=1082;   // PEAK = 见顶年（永乐城之败）
    const years=[], candles=[];
    let prevClose = ANCHORS[0][1];
    for(let y=START;y<=END;y++){
      years.push(String(y));
      const target = interpOn(ANCHORS,y);
      const open  = y===START ? ANCHORS[0][1] : prevClose;
      const close = target*(1+(rand()-0.5)*0.03) * (y===PEAK ? 1.07 : 1);  // 见顶年冲高
      const high  = Math.max(open,close);
      const low   = Math.min(open,close);
      candles.push([round1(open),round1(close),round1(low),round1(high)]);
      prevClose = close;
    }

    const yearIndex = {}; years.forEach((y,i)=>yearIndex[y]=i);
    const byYear = {}; EVENTS.forEach(e=>{(byYear[e.year]=byYear[e.year]||[]).push(e)});
    const emperorIndex = y => { for(let i=0;i<EMPERORS.length;i++){ if(y>=EMPERORS[i].s && y<=EMPERORS[i].e) return i; } return EMPERORS.length-1; };

    function ma(data,n){const r=[];for(let i=0;i<data.length;i++){if(i<n-1){r.push('-');continue}let s=0;for(let j=0;j<n;j++)s+=data[i-j][1];r.push(round1(s/n))}return r}

    let mode='year', cur=null, chart=null;

    function buildSeries(){
      if(mode==='year') return {cats:years.slice(), data:candles.slice(), ma:ma(candles,20), maName:'MA20'};
      const cats=[], data=[];
      EMPERORS.forEach(em=>{
        cats.push(em.name);
        let hi=-Infinity, lo=Infinity, o=0, c=0;
        for(let y=em.s;y<=em.e;y++){
          const k=candles[y-START];
          if(y===em.s) o=k[0];
          c=k[1];
          if(k[3]>hi) hi=k[3];
          if(k[2]<lo) lo=k[2];
        }
        data.push([round1(o),round1(c),round1(lo),round1(hi)]);
      });
      return {cats, data, ma:ma(data,3), maName:'MA3'};
    }

    // 标注点：缩放跨度 <=120 年时展开「事件名 —— 金融术语」（两行），全览时只显示术语
    let labelFull = false;
    function mkPoint(x,y,e,i){
      const bear = e.dir==='bear', c = dirColor(e.dir);
      const fmt = labelFull
        ? '{t|'+e.title+'}\n{m|—— '+e.term+'}'
        : '{m|'+e.term+'}';
      return {coord:[x,round1(y)], value:e.title+' —— '+e.term, eventIndex:i,
        symbol:'circle', symbolSize:9, z:12,
        itemStyle:{color:c,borderColor:'#0d1117',borderWidth:1.5},
        label:{show:true,position:bear?'bottom':'top',distance:8,align:'center',
          formatter:fmt,
          rich:{
            t:{color:'#e6e9ef',fontSize:10,lineHeight:13,fontFamily:mono},
            m:{color:c,fontSize:10,fontWeight:'bold',lineHeight:13,fontFamily:mono}
          },
          backgroundColor:'rgba(18,24,33,.94)',
          borderColor:c,borderWidth:1,padding:[4,7],borderRadius:5}};
    }

    function buildMarks(cats,data){
      const marks=[];
      if(mode==='year'){
        // 年份相近的事件纵向错开（最多 3 档），避免长标签叠在一起
        let lastYr=null, slot=0;
        EVENTS.forEach((e,i)=>{
          const k=candles[e.year-START];
          slot = (lastYr!==null && e.year-lastYr<=5) ? slot+1 : 0;
          lastYr = e.year;
          const off = 0.06 + (slot%3)*0.13;
          marks.push(mkPoint(String(e.year), e.dir==='bear'? Math.max(k[2]*(1-off),0.8) : k[3]*(1+off), e, i));
        });
      }else{
        const cnt={};
        EVENTS.forEach((e,i)=>{
          const ei=emperorIndex(e.year);
          cnt[ei]=(cnt[ei]||0)+1;
          const off=0.06+(cnt[ei]-1)*0.13;   // 同一皇帝多事件时纵向错开
          const k=data[ei];
          marks.push(mkPoint(EMPERORS[ei].name, e.dir==='bear'? Math.max(k[2]*(1-off),0.8) : k[3]*(1+off), e, i));
        });
      }
      // 历史最高点
      let hiIdx=0; data.forEach((k,i)=>{ if(k[3]>data[hiIdx][3]) hiIdx=i; });
      const hv=data[hiIdx][3];
      const hiTag='历史最高 '+hv+' · '+cats[hiIdx];
      marks.push({coord:[cats[hiIdx],hv], value:hiTag, symbol:'pin', symbolSize:36, z:20,
        itemStyle:{color:'#f0b90b'},
        label:{show:true,formatter:hiTag,position:'top',distance:10,
          color:'#0d1117',fontSize:11,fontWeight:'bold',
          backgroundColor:'#f0b90b',padding:[3,7],borderRadius:4}});
      return marks;
    }

    const tipRow = (k,v,color)=>'<div class="r"><span>'+k+'</span><span'+(color?' style="color:'+color+'"':'')+'>'+v+'</span></div>';
    const pctStr = (x,col)=>'<span style="color:'+col+'">'+(x>=0?'+':'')+x.toFixed(2)+'%</span>';

    function tipFormatter(params){
      const p=params.find(x=>x.seriesType==='candlestick'); if(!p) return '';
      const idx=p.dataIndex, k=cur.data[idx];
      const o=k[0], c=k[1], l=k[2], h=k[3];
      let head, evs=[], body;
      if(mode==='year'){
        const prev = idx>0 ? cur.data[idx-1][1] : o;       // 前一根收盘，据此算涨跌幅
        const pct  = (c-prev)/prev*100;
        const col  = c>=prev ? '#f23645' : '#089981';
        head = cur.cats[idx]+' 年';
        evs  = byYear[Number(cur.cats[idx])]||[];
        // 纯实体 K 线：最高/最低即开收两端，不再单列
        body = tipRow('开',o) + tipRow('收',c,col) + tipRow('涨跌幅', pctStr(pct,col));
      }else{
        const em  = EMPERORS[idx];
        const yrs = em.e-em.s+1;                            // 在位年数（首尾年计入）
        const pct = (c-o)/o*100;                            // 即位价 → 退位价
        const col = c>=o ? '#f23645' : '#089981';
        head = em.full+' · '+em.s+'–'+em.e;
        evs  = EVENTS.filter(e=>e.year>=em.s&&e.year<=em.e);
        body = tipRow('在位', yrs+' 年')
             + tipRow('即位价', o)
             + tipRow('退位价', c, col)
             + tipRow('在位最高', h)
             + tipRow('在位最低', l)
             + tipRow('在位涨跌幅', pctStr(pct,col));
      }
      let s='<div class="tip"><div class="y">'+head+'</div>'+body;
      evs.forEach(e=>{ s+='<div class="evn">▍'+e.title+' —— '+e.term+'</div>'; });
      return s+'</div>';
    }

    function render(){
      cur = buildSeries();
      labelFull = (mode==='emperor');      // 皇帝 K 只有 18 根，恒展开
      const marks = buildMarks(cur.cats, cur.data);
      chart.setOption({
        backgroundColor:'transparent',
        animationDuration:600,
        grid:{left:56,right:20,top:26,bottom:70},
        xAxis:{type:'category',data:cur.cats,boundaryGap:true,
          axisLine:{lineStyle:{color:'#2a3342'}},axisTick:{show:false},
          axisLabel:{color:'#8b93a7',fontFamily:mono,interval:mode==='year'?Math.floor(cur.cats.length/14):0},
          splitLine:{show:false}},
        yAxis:{scale:true,position:'left',
          axisLabel:{color:'#8b93a7',fontFamily:mono},
          splitLine:{lineStyle:{color:'#1c2431'}},axisLine:{show:false}},
        dataZoom:[
          {type:'inside',xAxisIndex:0,start:0,end:100},
          {type:'slider',xAxisIndex:0,height:18,bottom:8,borderColor:'#2a3342',
            backgroundColor:'#161c26',fillerColor:'rgba(41,98,255,0.15)',start:0,end:100,
            handleStyle:{color:'#3a4763'},moveHandleStyle:{color:'#3a4763'},
            textStyle:{color:'#8b93a7'},
            dataBackground:{lineStyle:{color:'#3a4763'},areaStyle:{color:'rgba(58,71,99,0.3)'}}}
        ],
        tooltip:{trigger:'axis',axisPointer:{type:'cross',label:{backgroundColor:'#3a4763',color:'#e6e9ef'}},
          backgroundColor:'rgba(20,26,36,.95)',borderColor:'#2a3342',
          textStyle:{color:'#e6e9ef',fontSize:12},formatter:tipFormatter},
        series:[
          {id:'k', name:'国运指数',type:'candlestick',data:cur.data,
            itemStyle:{color:'#f23645',color0:'#089981',borderColor:'#f23645',borderColor0:'#089981'},
            markPoint:{data:marks},
            markLine:{symbol:'none',lineStyle:{color:'#f0b90b',type:'dashed',width:1},
              label:{color:'#f0b90b',formatter:'发行价 100',position:'insideEndTop',fontFamily:mono},
              data:[{yAxis:100}]}},
          {name:cur.maName,type:'line',data:cur.ma,smooth:true,symbol:'none',
            lineStyle:{color:'#f0b90b',width:1.3,opacity:.9},z:3}
        ]
      }, {replaceMerge:['series']});
      updateHint();
    }

    chart = echarts.init(document.getElementById('chart'));
    render();
    window.addEventListener('resize', ()=>chart.resize());

    // ---- 标注详略自适应：缩放跨度 <=120 年展开完整标注，全览只显示术语 ----
    const SPAN_FULL = 120;
    function updateHint(){
      document.getElementById('lbHint').textContent =
        labelFull ? '完整标注' : '滚轮放大至 120 年内展开完整标注';
    }
    function applyMarks(){
      chart.setOption({series:[{id:'k', markPoint:{data: buildMarks(cur.cats, cur.data)}}]});
      updateHint();
    }
    function syncLabelMode(){
      if(mode==='emperor'){ labelFull=true; return; }
      const dz=(chart.getOption().dataZoom||[])[0];
      if(!dz) return;
      const span=(dz.end-dz.start)/100*cur.cats.length;   // 可见年数
      const full = span <= SPAN_FULL;
      if(full!==labelFull){ labelFull=full; applyMarks(); }
    }
    chart.on('dataZoom', syncLabelMode);

    // ---- 头部统计 ----
    const last = candles[candles.length-1][1];
    const hi   = Math.max.apply(null, candles.map(c=>c[3]));
    const chg  = (last-100)/100*100;
    document.getElementById('px').textContent = last.toFixed(1);
    const chgEl = document.getElementById('chg');
    chgEl.textContent = (chg>=0?'+':'')+chg.toFixed(1)+'%';
    chgEl.className = chg>=0?'up':'down';
    document.getElementById('hi').textContent = hi.toFixed(1);

    // ---- 事件时间轴 ----
    const tl=document.getElementById('timeline'), card=document.getElementById('card');
    EVENTS.forEach((e,i)=>{
      const d=document.createElement('div');
      d.className='ev ev-'+e.dir; d.dataset.i=i;
      d.innerHTML='<span class="yr">'+e.year+'</span><span class="tt">'+e.title+'</span><span class="tm">'+e.term+'</span>';
      d.addEventListener('click',()=>selectEvent(i,true));
      tl.appendChild(d);
    });

    // ---- 详情卡价位块：事件看当年 K，皇帝看即位/退位 ----
    const priceBox = document.getElementById('cPrice');
    function setPrice(rows){
      if(!rows){ priceBox.classList.add('hide'); return; }
      priceBox.innerHTML = rows.map(r=>'<div><label>'+r[0]+'</label><b'+(r[2]?' style="color:'+r[2]+'"':'')+'>'+r[1]+'</b></div>').join('');
      priceBox.classList.remove('hide');
    }

    function selectEvent(i,focus){
      const e=EVENTS[i];
      const term=document.getElementById('cTerm');
      term.textContent=e.term; term.className='cterm '+e.dir;
      document.getElementById('cTitle').textContent=e.title;
      document.getElementById('cMagLabel').textContent='冲击';
      document.getElementById('cYear').textContent=e.year+' 年';
      document.getElementById('cMag').textContent=e.mag;
      document.getElementById('cDesc').textContent=e.desc;
      const k=candles[e.year-START];                       // 当年 K 线
      const prev=(e.year-1>=START) ? candles[e.year-1-START][1] : k[0];
      const pct=(k[1]-prev)/prev*100, col=k[1]>=prev?'#f23645':'#089981';
      setPrice([['当年开盘',k[0]],['当年收盘',k[1],col],['当年涨跌幅',(pct>=0?'+':'')+pct.toFixed(2)+'%',col]]);
      card.classList.remove('hidden');
      Array.prototype.forEach.call(tl.children,(el,k2)=>el.classList.toggle('active',k2===i));
      if(focus){
        if(mode==='year'){ const idx=yearIndex[String(e.year)];
          chart.dispatchAction({type:'dataZoom',startValue:Math.max(0,idx-18),endValue:Math.min(cur.cats.length-1,idx+18)});
        }else{ const idx=emperorIndex(e.year);
          chart.dispatchAction({type:'dataZoom',startValue:Math.max(0,idx-3),endValue:Math.min(cur.cats.length-1,idx+3)});
        }
      }
    }

    function showEmperor(i){
      const em=EMPERORS[i], k=cur.data[i];
      const term=document.getElementById('cTerm');
      term.textContent=em.name; term.className='cterm neutral';
      document.getElementById('cTitle').textContent=em.full;
      document.getElementById('cMagLabel').textContent='事件';
      document.getElementById('cYear').textContent=em.s+'–'+em.e;
      const evs=EVENTS.filter(e=>e.year>=em.s&&e.year<=em.e);
      document.getElementById('cMag').textContent=evs.length+' 个';

      const yrs=em.e-em.s+1, pct=(k[1]-k[0])/k[0]*100, col=k[1]>=k[0]?'#f23645':'#089981';
      setPrice([['即位价',k[0]],['退位价',k[1],col],['在位涨跌幅',(pct>=0?'+':'')+pct.toFixed(2)+'%',col]]);
      document.getElementById('cDesc').textContent =
        '在位 '+yrs+' 年（'+em.s+'–'+em.e+'），国运自 '+k[0]+' 收于 '+k[1]+'，'+(pct>=0?'累涨':'累跌')+' '+Math.abs(pct).toFixed(2)+'%'
        +'；在位期间最高 '+k[3]+'、最低 '+k[2]+'。\n\n'
        + (evs.length ? evs.map(e=>e.year+' '+e.title+' · '+e.term).join('；') : '该朝无重大标注事件。');
      card.classList.remove('hidden');
      Array.prototype.forEach.call(tl.children,el=>el.classList.remove('active'));
    }

    document.getElementById('cardClose').addEventListener('click',()=>card.classList.add('hidden'));

    // ---- 粒度切换 ----
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'),b=>{
      b.addEventListener('click',()=>{
        if(b.classList.contains('on')) return;
        Array.prototype.forEach.call(document.querySelectorAll('.seg button'),x=>x.classList.remove('on'));
        b.classList.add('on');
        mode=b.dataset.mode;
        card.classList.add('hidden');
        render();
      });
    });

    chart.on('click',(p)=>{
      if(p.componentType==='markPoint' && p.data && p.data.eventIndex!=null){ selectEvent(p.data.eventIndex,false); return; }
      if(p.seriesType==='candlestick'){
        if(mode==='year'){
          const y=Number(cur.cats[p.dataIndex]); const i=EVENTS.findIndex(e=>e.year===y);
          if(i>=0) selectEvent(i,false);
        }else{ showEmperor(p.dataIndex); }
      }
    });
  })();
  </script>
</body>
</html>
