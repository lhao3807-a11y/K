<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王朝 K 线 · DYNASTY EXCHANGE</title>
<style>
  :root{
    --bg:#FFFFFF; --bg-alt:#F5F5F7; --band:#272729;
    --text:#1D1D1F; --text-2:#6E6E73; --text-3:#86868B; --axis:#C7CDD6;
    --blue:#0066CC; --blue-hover:#0077ED;
    --up:#F6465D; --down:#2EBD85;
    --line:#E0E0E0; --grid:#F0F0F0;
    --font-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-cn);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ============ 全局导航（黑色细条） ============ */
  .nav{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 32px;background:#000000;flex:none}
  .logo-group{display:flex;align-items:center;gap:10px}
  .logo-text{display:flex;flex-direction:column;gap:2px}
  .logo-cn{font-size:14px;font-weight:600;color:#FFFFFF;line-height:1.2}
  .logo-en{font-family:var(--mono);font-size:8px;color:#7A7A7A;letter-spacing:2px}
  .nav-links{display:flex;align-items:center;gap:28px}
  .nav-link{font-size:12px;color:#999999;cursor:pointer;user-select:none;text-decoration:none}
  .nav-link:hover{color:#FFFFFF}
  .nav-link.active{color:#FFFFFF;font-weight:500}
  .nav-right{display:flex;align-items:center;gap:16px}
  .backbtn{background:none;border:1px solid #3A3A3C;border-radius:9999px;color:#CCCCCC;font-size:12px;padding:6px 14px;cursor:pointer;font-family:var(--font-cn);transition:color .15s,border-color .15s}
  .backbtn:hover{color:#FFFFFF;border-color:#FFFFFF}
  .market-status{display:flex;align-items:center;gap:6px}
  .status-dot{width:8px;height:8px;border-radius:99px;background:var(--down)}
  .status-text{font-size:12px;font-weight:500;color:var(--down)}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(46,189,133,.45)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(46,189,133,0)}}
  .status-dot{animation:pulse 2.6s ease-in-out infinite}

  /* ============ 二级导航（磨砂 sticky） ============ */
  .subnav{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    height:52px;padding:0 48px;flex:none;
    background:rgba(246,246,247,.8);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
  }
  .subnav-left{display:flex;align-items:center;gap:10px}
  .subnav-name{font-size:20px;font-weight:600}
  .subnav-code{font-family:var(--mono);font-size:12px;color:var(--text-3)}
  .subnav-right{display:flex;align-items:center;gap:22px}
  .anchor-link{font-size:14px;color:#333333;cursor:pointer;text-decoration:none}
  .anchor-link:hover{color:var(--blue)}
  .anchor-link.active{color:var(--blue);font-weight:500}
  .dynsel{background:#FFFFFF;color:var(--text);border:1px solid var(--line);border-radius:9999px;font-family:var(--font-cn);font-size:13px;padding:7px 12px;cursor:pointer;max-width:220px}
  .dynsel:focus{outline:none;border-color:var(--blue)}
  .favbtn{background:var(--blue);border:none;border-radius:9999px;color:#FFFFFF;font-size:13px;font-weight:500;padding:8px 18px;cursor:pointer;font-family:var(--font-cn);transition:background .15s}
  .favbtn:hover{background:var(--blue-hover)}
  .favbtn.faved{background:#FFFFFF;color:var(--blue);border:1px solid var(--blue)}

  /* ============ 价格头部 ============ */
  .price-head{display:flex;flex-direction:column;gap:20px;padding:36px 48px 28px}
  .breadcrumb{display:flex;align-items:center;gap:8px}
  .breadcrumb .crumb{font-size:13px;color:var(--text-3);cursor:pointer}
  .breadcrumb .crumb:hover{color:var(--blue)}
  .breadcrumb .sep{font-family:var(--mono);font-size:13px;color:var(--axis)}
  .breadcrumb .current{font-size:13px;font-weight:500;color:var(--blue);cursor:default}
  .title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .dynasty-title{font-size:34px;font-weight:600;letter-spacing:-0.5px}
  .code-badge{background:var(--bg-alt);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;color:var(--text-2)}
  .status-tag{border-radius:6px;padding:4px 8px;font-size:11px;font-weight:500}
  .status-tag.up{background:rgba(246,70,93,.1);color:var(--up)}
  .status-tag.down{background:rgba(46,189,133,.1);color:var(--down)}
  .status-tag.pending{background:var(--bg-alt);color:var(--text-3)}
  .range-tag{background:var(--bg-alt);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text-2)}
  .price-row{display:flex;align-items:baseline;gap:16px}
  .price-now{font-family:var(--mono);font-size:56px;font-weight:600;line-height:58px}
  .price-chg{font-family:var(--mono);font-size:18px;font-weight:500}
  .metrics-row{display:flex;gap:40px;padding-top:4px;flex-wrap:wrap}
  .metric{display:flex;flex-direction:column;gap:4px}
  .metric label{font-size:12px;color:var(--text-3)}
  .metric b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)}

  /* ============ 图表主区 ============ */
  .chart-row{display:flex;gap:24px;padding:0 48px 48px;align-items:flex-start}
  .chart-card{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:20px}
  .chart-toolbar{display:flex;align-items:center;justify-content:space-between}
  .seg{display:flex;gap:4px;background:var(--bg-alt);border-radius:9999px;padding:4px}
  .seg button{background:transparent;border:none;color:var(--text-2);font-size:13px;padding:6px 14px;cursor:pointer;font-family:var(--font-cn);border-radius:9999px;transition:background .15s,color .15s}
  .seg button.on{background:#FFFFFF;color:var(--text);font-weight:500;box-shadow:0 0 0 1px var(--line)}
  .seg button:hover:not(.on){color:var(--text)}
  .toolbar-note{font-size:12px;color:var(--text-3)}
  .toolbar-note i{font-style:normal;color:var(--blue)}
  #chart{width:100%;height:480px}

  /* ============ 右侧数据面板 ============ */
  .side-panel{width:320px;flex:none;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:20px}
  .panel-title{font-size:16px;font-weight:600}
  .panel-divider{width:100%;height:1px;background:var(--grid)}
  .stat-row{display:flex;align-items:center;justify-content:space-between}
  .stat-label{font-size:13px;color:var(--text-3)}
  .stat-value{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text)}
  .event-row{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;transition:background .12s}
  .event-row:hover{background:var(--bg-alt)}
  .event-row.active{background:#F0F7FF}
  .event-year{font-family:var(--mono);font-size:12px;color:var(--text-3);flex:none;min-width:34px}
  .event-name{font-size:13px;color:#333333;flex:1;line-height:1.35}
  .event-impact{font-family:var(--mono);font-size:12px;font-weight:500;flex:none}

  /* ============ 帝王在位条 ============ */
  .emperor-sec{display:flex;flex-direction:column;gap:24px;padding:48px 48px 56px;background:var(--bg-alt)}
  .emperor-head{display:flex;flex-direction:column;gap:6px}
  .emperor-title{font-size:28px;font-weight:600;letter-spacing:-0.5px}
  .emperor-sub{font-size:14px;color:var(--text-3)}
  #empBars{display:flex;flex-direction:column;gap:10px}
  .emp-row{display:flex;align-items:center;gap:12px;cursor:pointer;padding:4px 8px;margin:0 -8px;border-radius:8px;transition:background .12s}
  .emp-row:hover{background:#FFFFFF}
  .emp-name{width:64px;flex:none;font-size:13px;font-weight:500}
  .emp-track{flex:1;height:20px}
  .emp-bar{height:20px;border-radius:5px;min-width:4px;transition:width .5s cubic-bezier(.22,.61,.36,1)}
  .emp-bar.up{background:rgba(246,70,93,.18)}
  .emp-bar.down{background:rgba(46,189,133,.18)}
  .emp-bar.flat{background:#E0E0E0}
  .emp-years{flex:none;font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .emp-pct{flex:none;width:64px;text-align:right;font-family:var(--mono);font-size:11px;font-weight:500}
  .emp-empty{font-size:13px;color:var(--text-3)}

  /* ============ 事件详情浮卡 ============ */
  #card{position:fixed;top:108px;right:22px;width:340px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.10);z-index:50;transition:opacity .18s,transform .18s;max-height:64vh;overflow-y:auto}
  #card.hidden{opacity:0;transform:translateY(10px);pointer-events:none}
  #cardClose{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--text-3);font-size:20px;cursor:pointer;line-height:1}
  #cardClose:hover{color:var(--text)}
  .cterm{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;margin-bottom:10px}
  .cterm.bull{background:rgba(246,70,93,.1);color:var(--up);border:1px solid rgba(246,70,93,.35)}
  .cterm.bear{background:rgba(46,189,133,.1);color:var(--down);border:1px solid rgba(46,189,133,.35)}
  .cterm.vol{background:rgba(0,102,204,.08);color:var(--blue);border:1px solid rgba(0,102,204,.3)}
  .cterm.neutral{background:var(--bg-alt);color:var(--text-2);border:1px solid var(--line)}
  #card h3{font-size:17px;margin-bottom:10px;padding-right:20px}
  .cmeta{display:flex;gap:14px;margin-bottom:10px;font-family:var(--mono);font-size:12px;color:var(--text-3)}
  .cmeta b{color:var(--text)}
  .cprice{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:4px 0 12px;padding:10px 12px;background:var(--bg-alt);border:1px solid var(--line);border-radius:9px;font-family:var(--mono)}
  .cprice div{display:flex;flex-direction:column;gap:4px}
  .cprice label{color:var(--text-3);font-size:10px;letter-spacing:.5px}
  .cprice b{font-size:15px;font-weight:600}
  .cprice.hide{display:none}
  #card p{font-size:13px;line-height:1.75;color:#444444;white-space:pre-line}

  /* ============ 页脚 ============ */
  footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:24px 48px;border-top:1px solid var(--grid)}
  footer p{font-size:12px;color:var(--text-3)}

  /* ============ 提示框（ECharts tooltip 内容） ============ */
  .tip{font-family:var(--mono);font-size:12px}
  .tip .y{font-weight:700;margin-bottom:5px;font-size:13px}
  .tip .r{display:flex;justify-content:space-between;gap:22px;line-height:1.6}
  .tip .evn{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--blue)}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .price-head{animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
  .chart-card{animation:rise .55s .06s cubic-bezier(.22,.61,.36,1) both}
  .side-panel{animation:rise .55s .12s cubic-bezier(.22,.61,.36,1) both}
  .emperor-sec{animation:rise .6s .18s cubic-bezier(.22,.61,.36,1) both}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
  @media (max-width:1100px){.chart-row{flex-direction:column}.side-panel{width:100%}}
  @media (max-width:720px){.subnav{padding:0 20px}.price-head,.chart-row,.emperor-sec,footer{padding-left:20px;padding-right:20px}#card{left:16px;right:16px;width:auto;top:auto;bottom:16px;max-height:52vh}}
</style>
</head>

  <!-- 演示模式回退数据：桌面端运行时优先走 pywebview js_api 直读 SQLite -->
  <script src="./data.js"></script>
  <script>
  (function(){
    const mono = "'Cascadia Mono','JetBrains Mono',Consolas,'Courier New',monospace";
    const UP = '#F6465D', DOWN = '#2EBD85', BLUE = '#0066CC';
    const round1 = x => Math.round(x*10)/10;
    const dirColor = d => d==='bull' ? UP : d==='bear' ? DOWN : d==='vol' ? BLUE : '#86868B';
    const fmtYear = y => y<0 ? '前'+(-y) : String(y);   // 公元前年份（DB 负数存储）

    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    // ---- 全局盘面状态：mount(王朝数据) 时整体重建 ----
    // 数据来源（二选一，由 boot 决定）：
    //   桌面端  -> pywebview js_api 直接读 SQLite（唯一数据源）
    //   浏览器  -> window.DYNASTY_DATA（data.js，演示模式）
    let D=null, ISSUE=100, START=0, END=0, PEAK=null, rand=null, SPAN_FULL=120;
    let EVENTS=[], EMPERORS=[], ANCHORS=[];
    let years=[], candles=[], yearIndex={}, byYear={};
    let mode='year', cur=null, chart=null, labelFull=false, empData=[];

    function showFatal(msg){
      document.body.innerHTML='<p style="padding:40px;color:#F6465D;font-family:Consolas,monospace">'+msg+'</p>';
    }

    function interpOn(list,y){
      if(y<=list[0][0]) return list[0][1];
      for(let i=0;i<list.length-1;i++){
        const a=list[i], b=list[i+1];
        if(y>=a[0] && y<=b[0]){ let t=(y-a[0])/(b[0]-a[0]); t=t*t*(3-2*t); return a[1]+(b[1]-a[1])*t; }
      }
      return list[list.length-1][1];
    }

    const emperorIndex = y => { for(let i=0;i<EMPERORS.length;i++){ if(y>=EMPERORS[i].s && y<=EMPERORS[i].e) return i; } return EMPERORS.length-1; };

    function ma(data,n){const r=[];for(let i=0;i<data.length;i++){if(i<n-1){r.push('-');continue}let s=0;for(let j=0;j<n;j++)s+=data[i-j][1];r.push(round1(s/n))}return r}

    // 皇帝 K 数据（即位价 / 退位价 / 在位最低 / 在位最高），年 K / 皇帝 K / 在位条共用
    function buildEmperorData(){
      const cats=[], data=[];
      EMPERORS.forEach(em=>{
        cats.push(em.name);
        let hi=-Infinity, lo=Infinity, o=0, c=0;
        for(let y=em.s;y<=em.e;y = (y===-1 ? 1 : y+1)){
          const k=candleAt(y);
          if(y===em.s) o=k[0];
          c=k[1];
          if(k[3]>hi) hi=k[3];
          if(k[2]<lo) lo=k[2];
        }
        data.push([round1(o),round1(c),round1(lo),round1(hi)]);
      });
      return {cats, data};
    }

    function buildSeries(){
      if(mode==='year') return {cats:years.slice(), data:candles.slice(), ma:ma(candles,D.config.maYear), maName:'MA'+D.config.maYear};
      const em=buildEmperorData();
      return {cats:em.cats, data:em.data, ma:ma(em.data,D.config.maEmperor), maName:'MA'+D.config.maEmperor};
    }

    // 波峰/波谷：锚点局部极值 + ±3 年内冲击最大的事件（巨>大>中>小）
    // K 线由锚点插值生成，锚点局部极值即走势的波峰/波谷
    const MAG_RANK = {'巨':4,'大':3,'中':2,'小':1};
    const magSig = e => MAG_RANK[(e.mag||'').slice(1)] || 0;
    function extremeEvents(){
      const out={};                       // 事件年份 -> {type, e, i}
      if(ANCHORS.length<3) return out;
      for(let i=1;i<ANCHORS.length-1;i++){
        const y1=ANCHORS[i][0], v0=ANCHORS[i-1][1], v1=ANCHORS[i][1], v2=ANCHORS[i+1][1];
        const type = (v1>v0 && v1>v2) ? 'peak' : (v1<v0 && v1<v2) ? 'trough' : null;
        if(!type) continue;
        let best=null;
        EVENTS.forEach((e,idx)=>{
          if(Math.abs(e.year-y1)<=3 && (!best || magSig(e)>magSig(best.e))) best={e,i:idx};
        });
        if(best && (!out[best.e.year] || magSig(best.e)>magSig(out[best.e.year].e)))
          out[best.e.year]={type, e:best.e, i:best.i};
      }
      return out;
    }

    // 标注点：缩放跨度 <=SPAN_FULL 年时展开「事件名 —— 金融术语」（两行），全览时只显示术语；
    // 波峰/波谷事件始终展开完整标注并带 ▲/▼ 前缀
    function mkPoint(x,y,e,i,ext){
      const bear = e.dir==='bear', c = dirColor(e.dir);
      const tag = ext ? (ext.type==='peak' ? '波峰 ▲ · ' : '波谷 ▼ · ') : '';
      const fmt = (labelFull || ext)
        ? (tag?'{x|'+tag+'}':'')+'{t|'+e.title+'}\n{m|—— '+e.term+'}'
        : '{m|'+e.term+'}';
      return {coord:[x,round1(y)], value:e.title+' —— '+e.term, eventIndex:i,
        symbol:'circle', symbolSize:ext?11:9, z:12,
        itemStyle:{color:c,borderColor:'#FFFFFF',borderWidth:1.5},
        label:{show:true,position:ext?(ext.type==='peak'?'top':'bottom'):(bear?'bottom':'top'),
          distance:8,align:'center',
          formatter:fmt,
          rich:Object.assign({
            t:{color:'#1D1D1F',fontSize:10,lineHeight:13,fontFamily:mono},
            m:{color:c,fontSize:10,fontWeight:'bold',lineHeight:13,fontFamily:mono}
          }, ext ? {x:{color:c,fontSize:10,fontWeight:'bold',lineHeight:13,fontFamily:mono}} : {}),
          backgroundColor:'rgba(255,255,255,.95)',
          borderColor:c,borderWidth:1,padding:[4,7],borderRadius:5,
          shadowColor:'rgba(0,0,0,.08)',shadowBlur:6}};
    }

    function buildMarks(cats,data){
      const marks=[], extMap = mode==='year' ? extremeEvents() : {};
      if(mode==='year'){
        // 年份相近的事件纵向错开（最多 3 档），避免长标签叠在一起
        let lastYr=null, slot=0;
        EVENTS.forEach((e,i)=>{
          const k=candleAt(e.year);
          slot = (lastYr!==null && e.year-lastYr<=5) ? slot+1 : 0;
          lastYr = e.year;
          const off = 0.06 + (slot%3)*0.13;
          const ext = extMap[e.year];
          const y = ext
            ? (ext.type==='peak' ? k[3]*(1+off) : Math.max(k[2]*(1-off),0.8))
            : (e.dir==='bear' ? Math.max(k[2]*(1-off),0.8) : k[3]*(1+off));
          marks.push(mkPoint(String(e.year), y, e, i, ext));
        });
      }else{
        const cnt={};
        EVENTS.forEach((e,i)=>{
          const ei=emperorIndex(e.year);
          cnt[ei]=(cnt[ei]||0)+1;
          const off=0.06+(cnt[ei]-1)*0.13;   // 同一皇帝多事件时纵向错开
          const k=data[ei];
          marks.push(mkPoint(EMPERORS[ei].name, e.dir==='bear'? Math.max(k[2]*(1-off),0.8) : k[3]*(1+off), e, i));
        });
      }
      // 历史最高点
      let hiIdx=0; data.forEach((k,i)=>{ if(k[3]>data[hiIdx][3]) hiIdx=i; });
      const hv=data[hiIdx][3];
      const hiTag='历史最高 '+hv+' · '+cats[hiIdx];
      marks.push({coord:[cats[hiIdx],hv], value:hiTag, symbol:'pin', symbolSize:26, z:20,
        itemStyle:{color:BLUE},
        label:{show:true,formatter:hiTag,position:'top',distance:6,
          color:'#FFFFFF',fontSize:11,fontWeight:'bold',
          backgroundColor:BLUE,padding:[3,7],borderRadius:4}});
      return marks;
    }

    const tipRow = (k,v,color)=>'<div class="r"><span>'+k+'</span><span'+(color?' style="color:'+color+'"':'')+'>'+v+'</span></div>';
    const pctStr = (x,col)=>'<span style="color:'+col+'">'+(x>=0?'+':'')+x.toFixed(2)+'%</span>';

    function tipFormatter(params){
      const p=params.find(x=>x.seriesType==='candlestick'); if(!p) return '';
      const idx=p.dataIndex, k=cur.data[idx];
      const o=k[0], c=k[1], l=k[2], h=k[3];
      let head, evs=[], body;
      if(mode==='year'){
        const prev = idx>0 ? cur.data[idx-1][1] : o;       // 前一根收盘，据此算涨跌幅
        const pct  = (c-prev)/prev*100;
        const col  = c>=prev ? UP : DOWN;
        head = cur.cats[idx]+' 年';
        evs  = byYear[Number(cur.cats[idx])]||[];
        // 纯实体 K 线：最高/最低即开收两端，不再单列
        body = tipRow('开',o) + tipRow('收',c,col) + tipRow('涨跌幅', pctStr(pct,col));
      }else{
        const em  = EMPERORS[idx];
        const yrs = em.e-em.s+1;                            // 在位年数（首尾年计入）
        const pct = (c-o)/o*100;                            // 即位价 → 退位价
        const col = c>=o ? UP : DOWN;
        head = em.full+' · '+em.s+'–'+em.e;
        evs  = EVENTS.filter(e=>e.year>=em.s&&e.year<=em.e);
        body = tipRow('在位', yrs+' 年')
             + tipRow('即位价', o)
             + tipRow('退位价', c, col)
             + tipRow('在位最高', h)
             + tipRow('在位最低', l)
             + tipRow('在位涨跌幅', pctStr(pct,col));
      }
      let s='<div class="tip"><div class="y">'+head+'</div>'+body;
      evs.forEach(e=>{ s+='<div class="evn">▍'+e.title+' —— '+e.term+'</div>'; });
      return s+'</div>';
    }

    function render(){
      cur = buildSeries();
      labelFull = (mode==='emperor');      // 皇帝 K 只有 18 根，恒展开
      const marks = buildMarks(cur.cats, cur.data);
      chart.setOption({
        backgroundColor:'transparent',
        animationDuration:600,
        grid:{left:56,right:20,top:52,bottom:70},
        xAxis:{type:'category',data:cur.cats,boundaryGap:true,
          axisLine:{lineStyle:{color:'#E0E0E0'}},axisTick:{show:false},
          axisLabel:{color:'#86868B',fontFamily:mono,interval:mode==='year'?Math.floor(cur.cats.length/14):0},
          splitLine:{show:false}},
        yAxis:{scale:true,position:'left',
          // 顶部留 25% 余量，避免历史最高 pin 及其标签被上边缘裁掉
          max:function(v){ return Math.ceil((v.max + (v.max-v.min)*0.25)/5)*5; },
          axisLabel:{color:'#86868B',fontFamily:mono},
          splitLine:{lineStyle:{color:'#F0F0F0'}},axisLine:{show:false}},
        dataZoom:[
          {type:'inside',xAxisIndex:0,start:0,end:100},
          {type:'slider',xAxisIndex:0,height:18,bottom:8,borderColor:'#E0E0E0',
            backgroundColor:'#F5F5F7',fillerColor:'rgba(0,102,204,0.12)',start:0,end:100,
            handleStyle:{color:'#C7CDD6'},moveHandleStyle:{color:'#C7CDD6'},
            textStyle:{color:'#86868B'},
            dataBackground:{lineStyle:{color:'#C7CDD6'},areaStyle:{color:'rgba(199,205,214,0.25)'}}}
        ],
        tooltip:{trigger:'axis',axisPointer:{type:'cross',label:{backgroundColor:BLUE,color:'#FFFFFF'}},
          backgroundColor:'rgba(255,255,255,.97)',borderColor:'#E0E0E0',
          textStyle:{color:'#1D1D1F',fontSize:12},formatter:tipFormatter},
        series:[
          {id:'k', name:'国运指数',type:'candlestick',data:cur.data,
            itemStyle:{color:UP,color0:DOWN,borderColor:UP,borderColor0:DOWN},
            markPoint:{data:marks},
            markLine:{symbol:'none',lineStyle:{color:'#86868B',type:'dashed',width:1},
              label:{color:'#86868B',formatter:'发行价 '+ISSUE,position:'insideEndTop',fontFamily:mono},
              data:[{yAxis:ISSUE}]}},
          {name:cur.maName,type:'line',data:cur.ma,smooth:true,symbol:'none',
            lineStyle:{color:BLUE,width:1.3,opacity:.9},z:3}
        ]
      }, {replaceMerge:['series']});
      updateHint();
    }

    const tl=document.getElementById('timeline'), card=document.getElementById('card');

    // ---- 标注详略自适应：缩放跨度 <=SPAN_FULL 年展开完整标注，全览只显示术语 ----
    function updateHint(){
      document.getElementById('lbHint').textContent =
        labelFull ? ' · 完整标注' : ' · 滚轮放大至 '+SPAN_FULL+' 年内展开完整标注';
    }
    function applyMarks(){
      chart.setOption({series:[{id:'k', markPoint:{data: buildMarks(cur.cats, cur.data)}}]});
      updateHint();
    }
    function syncLabelMode(){
      if(mode==='emperor'){ labelFull=true; return; }
      const dz=(chart.getOption().dataZoom||[])[0];
      if(!dz) return;
      const span=(dz.end-dz.start)/100*cur.cats.length;   // 可见年数
      const full = span <= SPAN_FULL;
      if(full!==labelFull){ labelFull=full; applyMarks(); }
    }

    // ---- 生成年 K 线 [open, close, low, high] ----
    // 纯实体 K 线：不画上下影线，high/low 收敛到实体两端
    function buildCandles(){
      years=[]; candles=[];
      let prevClose = ANCHORS[0][1];
      // 纪年连续：公元纪年无 0 年（-1 之后是 1）
      for(let y=START;y<=END;y = (y===-1 ? 1 : y+1)){
        years.push(fmtYear(y));
        const target = interpOn(ANCHORS,y);
        const open  = y===START ? ANCHORS[0][1] : prevClose;
        const close = target*(1+(rand()-0.5)*0.03) * (y===PEAK ? 1.07 : 1);  // 见顶年冲高
        const high  = Math.max(open,close);
        const low   = Math.min(open,close);
        candles.push([round1(open),round1(close),round1(low),round1(high)]);
        prevClose = close;
      }
      yearIndex={}; years.forEach((y,i)=>yearIndex[y]=i);
      byYear={}; EVENTS.forEach(e=>{(byYear[e.year]=byYear[e.year]||[]).push(e)});
    }

    // 年份 -> 对应 K 线（跨公元前/公元后时用 yearIndex 精确映射，避免 0 年错位）
    const candleAt = y => candles[yearIndex[fmtYear(y)]];

    // 事件年单年冲击：事件年收盘 vs 前一交易日收盘
    function impactPct(year){
      const i=yearIndex[fmtYear(year)];
      if(i==null || i<1) return null;
      return (candles[i][1]-candles[i-1][1])/candles[i-1][1]*100;
    }

    function updateHeaderStats(){
      const last = candles[candles.length-1][1];
      const hi   = Math.max.apply(null, candles.map(c=>c[3]));
      const lo   = Math.min.apply(null, candles.map(c=>c[2]));
      const chg  = (last-ISSUE)/ISSUE*100;
      const col  = chg>=0 ? 'up' : 'down';
      const pxEl = document.getElementById('px');
      pxEl.textContent = last.toFixed(1); pxEl.className = 'price-now '+col;
      const chgEl = document.getElementById('chg');
      chgEl.textContent = '较发行价 '+(chg>=0?'+':'')+chg.toFixed(1)+'%';
      chgEl.className = 'price-chg '+col;
      const stEl = document.getElementById('dynStatus');
      stEl.textContent = chg>=0 ? '上涨' : '下跌'; stEl.className = 'status-tag '+col;
      document.getElementById('mIssue').textContent = ISSUE.toFixed(2);
      const mHi = document.getElementById('mHi');
      mHi.textContent = hi.toFixed(1); mHi.className = 'up';
      const mLo = document.getElementById('mLo');
      mLo.textContent = lo.toFixed(1); mLo.className = 'down';
      document.getElementById('mLast').textContent = last.toFixed(1);
      document.getElementById('mDur').textContent = (END-START+1)+' 年';
      document.getElementById('mEmpN').textContent = EMPERORS.length+' 位';
      // 侧栏关键数据
      document.getElementById('sEmpFirst').textContent = EMPERORS.length ? EMPERORS[0].name : '—';
      document.getElementById('sEmpLast').textContent  = EMPERORS.length ? EMPERORS[EMPERORS.length-1].name : '—';
      document.getElementById('sDur').textContent      = (END-START+1)+' 年';
      document.getElementById('sEmpCount').textContent = EMPERORS.length+' 位';
      document.getElementById('sPeakYear').textContent = PEAK!=null ? fmtYear(PEAK)+' 年' : '—';
      const spv = document.getElementById('sPeakVal');
      spv.textContent = hi.toFixed(2); spv.className = 'stat-value up';
    }

    function buildTimeline(){
      tl.innerHTML='';
      if(!EVENTS.length){
        tl.innerHTML='<div class="emp-empty">锚点/事件数据入库后在此展示</div>';
        return;
      }
      EVENTS.forEach((e,i)=>{
        const d=document.createElement('div');
        d.className='event-row'; d.dataset.i=i;
        let impact='', ic='';
        if(candles.length){
          const p=impactPct(e.year);
          if(p!=null){ ic=p>=0?'up':'down'; impact=(p>=0?'+':'')+p.toFixed(1)+'%'; }
        }
        if(!impact){ impact=e.mag||''; ic=''; }
        d.innerHTML='<span class="event-year">'+fmtYear(e.year)+'</span>'
          +'<span class="event-name">'+e.title+' · '+e.term+'</span>'
          +'<span class="event-impact '+ic+'">'+impact+'</span>';
        d.addEventListener('click',()=>selectEvent(i,true));
        tl.appendChild(d);
      });
    }

    // ---- 帝王在位条：条长 = 在位时长，颜色 = 任内涨跌 ----
    function buildEmperorBars(){
      const box=document.getElementById('empBars');
      box.innerHTML='';
      if(!empData.length){
        box.innerHTML='<div class="emp-empty">皇帝数据入库后展示在位条</div>';
        return;
      }
      let maxDur=1;
      EMPERORS.forEach(em=>{ const d=em.e-em.s+1; if(d>maxDur) maxDur=d; });
      EMPERORS.forEach((em,i)=>{
        const k=empData[i], dur=em.e-em.s+1;
        const pct=(k[1]-k[0])/k[0]*100, c=pct>=0?'up':'down';
        const row=document.createElement('div');
        row.className='emp-row';
        row.innerHTML='<span class="emp-name">'+em.name+'</span>'
          +'<div class="emp-track"><div class="emp-bar '+c+'" style="width:0"></div></div>'
          +'<span class="emp-years">'+fmtYear(em.s)+'–'+fmtYear(em.e)+' · '+dur+'年</span>'
          +'<span class="emp-pct '+c+'">'+(pct>=0?'+':'')+pct.toFixed(1)+'%</span>';
        row.addEventListener('click',()=>showEmperor(i));
        box.appendChild(row);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          row.querySelector('.emp-bar').style.width=Math.max(2, dur/maxDur*100)+'%';
        }));
      });
    }

    // ---- 挂载一个王朝：盘面数据 / 图表 / 时间轴 / 统计全部重建 ----
    function mount(dyn){
      D=dyn;
      ISSUE=D.dynasty.issuePrice;
      START=D.dynasty.startYear; END=D.dynasty.endYear; PEAK=D.dynasty.peakYear;
      rand=mulberry32(D.dynasty.seed);
      const cfg=D.config||{};
      SPAN_FULL=cfg.spanFull||120;
      EVENTS=D.events; EMPERORS=D.emperors; ANCHORS=D.anchors;
      mode='year'; labelFull=false; cur=null; empData=[];

      document.title = D.dynasty.name+' K线图 · '+D.dynasty.code;
      document.getElementById('dynName').textContent = D.dynasty.name;
      document.getElementById('dynCode').textContent = D.dynasty.code;
      document.getElementById('dynRange').textContent = D.dynasty.rangeLabel;
      document.getElementById('subName').textContent = D.dynasty.name;
      document.getElementById('subCode').textContent = D.dynasty.code;
      document.getElementById('crumbCur').textContent = D.dynasty.name;

      // ---- 筹备中占位态：锚点 >=2 个才能生成 K 线；数据入库后自动挂牌 ----
      if(!ANCHORS || ANCHORS.length<2){
        candles=[]; years=[]; yearIndex={}; byYear={}; cur=null;
        ['px','mIssue','mHi','mLo','mLast','mDur','mEmpN',
         'sEmpFirst','sEmpLast','sDur','sEmpCount','sPeakYear','sPeakVal'].forEach(id=>{
          const el=document.getElementById(id); el.textContent='—'; el.className=el.className.replace(/\b(up|down)\b/g,'').trim();
        });
        const chgEl=document.getElementById('chg');
        chgEl.textContent='数据筹备中'; chgEl.className='price-chg';
        const stEl=document.getElementById('dynStatus');
        stEl.textContent='筹备中'; stEl.className='status-tag pending';
        buildTimeline();
        document.getElementById('empBars').innerHTML='<div class="emp-empty">数据筹备中 · 皇帝数据入库后展示在位条</div>';
        if(chart) chart.dispose();
        chart = echarts.init(document.getElementById('chart'));
        chart.setOption({graphic:[
          {type:'text',left:'center',top:'44%',style:{text:'数据筹备中',fill:'#86868B',font:'600 22px '+mono}},
          {type:'text',left:'center',top:'52%',style:{text:'锚点/皇帝/事件数据入库后，K 线自动生成',fill:'#C7CDD6',font:'13px '+mono}},
        ]});
        return;
      }

      buildCandles();
      empData = buildEmperorData().data;
      buildTimeline();
      buildEmperorBars();
      updateHeaderStats();

      // 粒度按钮复位到年 K
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'),
        b=>b.classList.toggle('on', b.dataset.mode==='year'));
      card.classList.add('hidden');

      if(chart) chart.dispose();
      chart = echarts.init(document.getElementById('chart'));
      chart.on('dataZoom', syncLabelMode);
      chart.on('click', onChartClick);
      render();
    }

    // ---- 详情卡价位块：事件看当年 K，皇帝看即位/退位 ----
    const priceBox = document.getElementById('cPrice');
    function setPrice(rows){
      if(!rows){ priceBox.classList.add('hide'); return; }
      priceBox.innerHTML = rows.map(r=>'<div><label>'+r[0]+'</label><b'+(r[2]?' style="color:'+r[2]+'"':'')+'>'+r[1]+'</b></div>').join('');
      priceBox.classList.remove('hide');
    }

    function selectEvent(i,focus){
      const e=EVENTS[i];
      const term=document.getElementById('cTerm');
      term.textContent=e.term; term.className='cterm '+e.dir;
      document.getElementById('cTitle').textContent=e.title;
      document.getElementById('cMagLabel').textContent='冲击';
      document.getElementById('cYear').textContent=fmtYear(e.year)+' 年';
      document.getElementById('cMag').textContent=e.mag;
      document.getElementById('cDesc').textContent=e.desc;
      const k=candleAt(e.year);                            // 当年 K 线
      const prevYr = e.year===-1 ? 1 : e.year-1;           // 前一纪年（无 0 年）
      const prev = (e.year>START) ? candleAt(prevYr)[1] : k[0];
      const pct=(k[1]-prev)/prev*100, col=k[1]>=prev?UP:DOWN;
      setPrice([['当年开盘',k[0]],['当年收盘',k[1],col],['当年涨跌幅',(pct>=0?'+':'')+pct.toFixed(2)+'%',col]]);
      card.classList.remove('hidden');
      Array.prototype.forEach.call(tl.children,(el,k2)=>el.classList.toggle('active',k2===i));
      if(focus){
        if(mode==='year'){ const idx=yearIndex[fmtYear(e.year)];
          chart.dispatchAction({type:'dataZoom',startValue:Math.max(0,idx-18),endValue:Math.min(cur.cats.length-1,idx+18)});
        }else{ const idx=emperorIndex(e.year);
          chart.dispatchAction({type:'dataZoom',startValue:Math.max(0,idx-3),endValue:Math.min(cur.cats.length-1,idx+3)});
        }
      }
    }

    function showEmperor(i){
      const em=EMPERORS[i], k=empData[i];
      const term=document.getElementById('cTerm');
      term.textContent=em.name; term.className='cterm neutral';
      document.getElementById('cTitle').textContent=em.full;
      document.getElementById('cMagLabel').textContent='事件';
      document.getElementById('cYear').textContent=fmtYear(em.s)+'–'+fmtYear(em.e);
      const evs=EVENTS.filter(e=>e.year>=em.s&&e.year<=em.e);
      document.getElementById('cMag').textContent=evs.length+' 个';

      const yrs=em.e-em.s+1, pct=(k[1]-k[0])/k[0]*100, col=k[1]>=k[0]?UP:DOWN;
      setPrice([['即位价',k[0]],['退位价',k[1],col],['在位涨跌幅',(pct>=0?'+':'')+pct.toFixed(2)+'%',col]]);
      document.getElementById('cDesc').textContent =
        '在位 '+yrs+' 年（'+em.s+'–'+em.e+'），国运自 '+k[0]+' 收于 '+k[1]+'，'+(pct>=0?'累涨':'累跌')+' '+Math.abs(pct).toFixed(2)+'%'
        +'；在位期间最高 '+k[3]+'、最低 '+k[2]+'。\n\n'
        + (evs.length ? evs.map(e=>e.year+' '+e.title+' · '+e.term).join('；') : '该朝无重大标注事件。');
      card.classList.remove('hidden');
      Array.prototype.forEach.call(tl.children,el=>el.classList.remove('active'));
    }

    function onChartClick(p){
      if(p.componentType==='markPoint' && p.data && p.data.eventIndex!=null){ selectEvent(p.data.eventIndex,false); return; }
      if(p.seriesType==='candlestick'){
        if(mode==='year'){
          const y=Number(cur.cats[p.dataIndex]); const i=EVENTS.findIndex(e=>e.year===y);
          if(i>=0) selectEvent(i,false);
        }else{ showEmperor(p.dataIndex); }
      }
    }

    // ---- 一次性全局监听（跨王朝复用） ----
    document.getElementById('cardClose').addEventListener('click',()=>card.classList.add('hidden'));
    document.getElementById('backHome').addEventListener('click',()=>{ window.location.href='dynasty-exchange.html'; });
    document.getElementById('crumbHome').addEventListener('click',()=>{ window.location.href='dynasty-exchange.html'; });
    window.addEventListener('resize', ()=>{ if(chart) chart.resize(); });
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'),b=>{
      b.addEventListener('click',()=>{
        if(b.classList.contains('on')) return;
        Array.prototype.forEach.call(document.querySelectorAll('.seg button'),x=>x.classList.remove('on'));
        b.classList.add('on');
        mode=b.dataset.mode;
        if(mode==='emperor' && !EMPERORS.length){ mode='year'; b.classList.remove('on'); return; }  // 无皇帝数据保持年K
        card.classList.add('hidden');
        render();
      });
    });
    // 二级导航锚点滚动
    Array.prototype.forEach.call(document.querySelectorAll('.anchor-link'),a=>{
      a.addEventListener('click',()=>{
        Array.prototype.forEach.call(document.querySelectorAll('.anchor-link'),x=>x.classList.remove('active'));
        a.classList.add('active');
        const t=document.getElementById(a.dataset.anchor);
        if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
      });
    });
    // 加入自选（会话内状态，按王朝代码记忆）
    const favSet=new Set();
    document.getElementById('favBtn').addEventListener('click',function(){
      const code=D?D.dynasty.code:'';
      if(!code) return;
      const on=!favSet.has(code);
      if(on) favSet.add(code); else favSet.delete(code);
      this.textContent=on?'✓ 已自选':'加入自选';
      this.classList.toggle('faved',on);
    });
    function syncFavBtn(){
      const b=document.getElementById('favBtn');
      const on=D && favSet.has(D.dynasty.code);
      b.textContent=on?'✓ 已自选':'加入自选';
      b.classList.toggle('faved',!!on);
    }

    // ---- 启动：桌面端走 pywebview js_api（SQLite 唯一数据源），浏览器回退 data.js ----
    function waitForApi(timeout){
      return new Promise(resolve=>{
        const t0=Date.now();
        (function check(){
          if(window.pywebview && window.pywebview.api) return resolve(window.pywebview.api);
          if(Date.now()-t0>timeout) return resolve(null);
          setTimeout(check,80);
        })();
      });
    }

    (async function boot(){
      const sel=document.getElementById('dynSwitch');
      try{
        const api=await waitForApi(2500);
        if(api){
          const list=JSON.parse(await api.list_dynasties());
          if(!list.length){ showFatal('数据库中暂无王朝数据 —— 请先运行：python database/manage.py init'); return; }
          sel.style.display='';
          sel.innerHTML=list.map(d=>'<option value="'+d.code+'">'+d.name+' '+d.code+'</option>').join('');
          // 深链优先：dynasty-exchange.html 跳转时带 #CODE
          const want=decodeURIComponent((location.hash||'').replace('#',''));
          const active=list.find(d=>d.code===want) || list.find(d=>d.isActive) || list[0];
          sel.value=active.code;
          mount(JSON.parse(await api.get_dynasty(active.code)));
          syncFavBtn();
          sel.addEventListener('change', async ()=>{
            if(location.hash) location.hash='';   // 手动切换后清除深链，避免刷新跳回
            const d=JSON.parse(await api.get_dynasty(sel.value));
            if(d && !d.error){ mount(d); syncFavBtn(); }
          });
          // 同页 hash 变化（如从别处改链直达另一王朝）也响应
          window.addEventListener('hashchange', async ()=>{
            const c=decodeURIComponent(location.hash.replace('#',''));
            if(!c || c===sel.value) return;
            const hit=list.find(d=>d.code===c);
            if(!hit) return;
            sel.value=c;
            mount(JSON.parse(await api.get_dynasty(c)));
            syncFavBtn();
          });
        }else if(window.DYNASTY_DATA){
          mount(window.DYNASTY_DATA);   // 浏览器演示模式
        }else{
          showFatal('缺少数据源 —— 桌面端请通过 python app.py 启动；浏览器演示请先运行 python database/manage.py export');
        }
      }catch(err){ showFatal('数据加载失败：'+err); }
    })();
  })();
  </script>
</body>
</html>
