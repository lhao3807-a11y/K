<style>
  :root {

<script>
(function(){
  const UP='#F6465D', DOWN='#2EBD85', BLUE='#0066CC';
  const KLINE = window.KLINE;
  const $ = id => document.getElementById(id);
  const fmtPct = x => (x>=0?'+':'') + x.toFixed(2) + '%';
  const clsOf = x => x>=0 ? 'up' : 'down';

  let D=null, chart=null, mode='year';
  let years=[], candles=[], yearIndex={};

  function waitForApi(timeout){
    return new Promise(res=>{
      const t0=Date.now();
      (function check(){
        if(window.pywebview && window.pywebview.api) return res(window.pywebview.api);
        if(Date.now()-t0>timeout) return res(null);
        setTimeout(check,80);
      })();
    });
  }

  function renderHeader(){
    const f=D.figure, st=KLINE.stats(candles, f.issuePrice), c=clsOf(st.chg);
    $('fName').textContent=f.name;
    $('fCode').textContent=f.code;
    $('fAlias').textContent=[f.alias, f.role].filter(Boolean).join(' · ');
    $('fSummary').textContent=f.summary||'';
    $('fRange').textContent=f.rangeLabel||'';
    const stEl=$('fStatus');
    stEl.textContent = st.chg>=0 ? '上涨' : '下跌';
    stEl.className = 'status-tag '+c;
    const p=$('fPrice'); p.textContent=st.last.toFixed(1); p.className='price-now '+c;
    const g=$('fChg'); g.textContent='较发行价 '+fmtPct(st.chg); g.className='price-chg '+c;

    const dur=f.endYear-f.startYear+1;
    const hiYear=years[candles.findIndex(k=>k[3]===st.high)];
    const loYear=years[candles.findIndex(k=>k[2]===st.low)];
    const m=[
      ['发行价', f.issuePrice.toFixed(2), ''],
      ['历史最高', st.high.toFixed(1), 'up'],
      ['历史最低', st.low.toFixed(1), 'down'],
      ['摘牌价', st.last.toFixed(1), c],
      ['存续', dur+' 年', ''],
      ['人生阶段', (D.periods||[]).length+' 段', ''],
      ['最大回撤', fmtPct(st.maxDrawdown), 'down'],
    ];
    $('metrics').innerHTML = m.map(x=>
      '<div class="metric"><span class="metric-label">'+x[0]+'</span>'
      +'<span class="metric-value '+(x[2]||'')+'">'+x[1]+'</span></div>').join('');
    $('afterlifeDesc').textContent =
      '摘牌价 '+st.last.toFixed(1)+'（较发行价 '+fmtPct(st.chg)+'）。'
      +'然而自中唐以降，其声望曲线再无像样回撤 —— 世俗账面上的破发，'
      +'在另一个市场里是永不兑现的长线牛股。';
    window.__hiYear = hiYear; window.__loYear = loYear;
  }

  function buildSeries(){
    if(mode==='year') return {cats:years.map(String), data:candles};
    const spans=(D.periods||[]).map(p=>({s:p.s,e:p.e}));
    const data=KLINE.aggregate(candles, years, spans);
    return {cats:(D.periods||[]).map(p=>p.name), data:data};
  }

  // 标注层：① 锚点（菱形+数值，标明曲线拐点的定价依据，仅年 K）
  //         ② 大事记（巨/大档，红涨绿跌，两种模式都在）
  function buildMarks(cats, data){
    const rank={'巨':4,'大':3,'中':2,'小':1};
    const marks=[];
    if(mode==='year'){
      const anchors=D.anchors||[];
      anchors.forEach((a,i)=>{
        const idx=yearIndex[a[0]];
        if(idx==null) return;
        const prev = i>0 ? anchors[i-1][1] : a[1];
        const isPeak = a[1]>=prev;               // 相对前一锚点判断峰/谷，决定标签方向
        marks.push({
          name:'锚点 '+a[0], value:a[1],
          coord:[String(a[0]), a[1]],
          symbol:'diamond', symbolSize:8, z:9,
          itemStyle:{color:'#FFFFFF', borderColor:BLUE, borderWidth:1.5},
          label:{show:true, position:isPeak?'top':'bottom', distance:5,
            formatter:'{a|'+a[1]+'}',
            rich:{a:{color:BLUE, fontSize:10, fontFamily:'"Cascadia Mono","JetBrains Mono",Consolas,monospace',
                     lineHeight:12}}}
        });
      });
    }
    const evs=(D.events||[]).filter(e=>rank[(e.mag||'').slice(1)]>=3);
    evs.forEach((e,i)=>{
      let v=null;
      if(mode==='year'){
        const idx=yearIndex[e.year];
        v = idx==null ? null : candles[idx][3];
      }else{
        const pi=(D.periods||[]).findIndex(p=>e.year>=p.s && e.year<=p.e);
        v = pi<0 ? null : data[pi][3];
      }
      if(v==null) return;
      const col = e.dir==='bear' ? DOWN : UP;
      marks.push({
        name:e.title, value:e.term,
        coord:[mode==='year'?String(e.year):cats[(D.periods||[]).findIndex(p=>e.year>=p.s&&e.year<=p.e)], v],
        symbol:'circle', symbolSize:9, z:12,
        itemStyle:{color:col, borderColor:'#FFFFFF', borderWidth:1.5},
        label:{show:true, position: e.dir==='bear' ? 'bottom' : 'top',
               distance: i%2 ? 22 : 8,   // 相邻事件错开避让
               formatter:'{a|'+e.title+'}\n{b|—— '+e.term+'}',
               align:'center',
               rich:{a:{color:'#1D1D1F', fontSize:10, lineHeight:13,
                        fontFamily:'"Cascadia Mono","JetBrains Mono",Consolas,monospace'},
                     b:{color:col, fontSize:10, fontWeight:'bold', lineHeight:13,
                        fontFamily:'"Cascadia Mono","JetBrains Mono",Consolas,monospace'}},
               backgroundColor:'rgba(255,255,255,.95)', borderColor:col, borderWidth:1,
               padding:[4,7], borderRadius:5,
               shadowColor:'rgba(0,0,0,.08)', shadowBlur:6}
      });
    });
    return marks;
  }

  function renderChart(){
    const s=buildSeries();
    if(!chart) chart=echarts.init($('chart'));
    chart.setOption({
      backgroundColor:'#FFFFFF',
      animation:false,
      grid:{left:58,right:26,top:48,bottom:56},
      tooltip:{trigger:'axis', axisPointer:{type:'cross'},
        backgroundColor:'#FFFFFF', borderColor:'#E0E0E0', borderWidth:1,
        textStyle:{color:'#1D1D1F', fontSize:12},
        formatter:function(ps){
          const k=ps[0].data;
          return ps[0].axisValue+'<br/>开 '+k[1]+'　收 '+k[2]
                 +'<br/>低 '+k[3]+'　高 '+k[4];
        }},
      xAxis:{type:'category', data:s.cats,
        axisLine:{lineStyle:{color:'#C7CDD6'}},
        axisLabel:{color:'#86868B', fontSize:11, interval:'auto'}},
      yAxis:{scale:true, splitLine:{lineStyle:{color:'#F0F0F0'}},
        axisLine:{show:false}, axisLabel:{color:'#86868B', fontSize:11}},
      dataZoom:[{type:'inside'},{type:'slider', height:16, bottom:14,
        borderColor:'#E0E0E0', fillerColor:'rgba(0,102,204,.06)'}],
      series:[{
        type:'candlestick', data:s.data.map(k=>[k[0],k[1],k[2],k[3]]),
        itemStyle:{color:UP, color0:DOWN, borderColor:UP, borderColor0:DOWN},
        markPoint:{symbolSize:9, data:buildMarks(s.cats, s.data)}
      }]
    }, true);
    ['year','period'].forEach(m=>$(m==='year'?'btnYear':'btnPeriod')
      .classList.toggle('active', m===mode));
    // 锚点为年 K 专属标注层，切到阶段 K 时隐藏对应图例
    const lg=$('chartLegend');
    if(lg && lg.firstElementChild) lg.firstElementChild.style.display = mode==='year' ? '' : 'none';
  }

  function renderPeriods(){
    const spans=(D.periods||[]).map(p=>({s:p.s,e:p.e}));
    const agg=KLINE.aggregate(candles, years, spans);
    const maxDur=Math.max.apply(null,(D.periods||[]).map(p=>p.e-p.s+1));
    $('periodBox').innerHTML=(D.periods||[]).map((p,i)=>{
      const a=agg[i], pct=(a[1]-a[0])/a[0]*100, c=clsOf(pct), dur=p.e-p.s+1;
      return '<div class="period-row">'
        +'<span class="per-name">'+p.name+'</span>'
        +'<div class="per-track"><div class="per-bar '+c+'" data-w="'
        +Math.max(2,dur/maxDur*100)+'" style="background:'+(pct>=0?UP:DOWN)+'"></div></div>'
        +'<span class="per-years">'+p.s+'–'+p.e+' · '+dur+'年</span>'
        +'<span class="per-pct '+c+'">'+fmtPct(pct)+'</span>'
        +'<span class="per-theme">'+(p.theme||'')+'</span></div>';
    }).join('');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      document.querySelectorAll('.per-bar').forEach(b=>{ b.style.width=b.dataset.w+'%'; });
    }));
  }

  function renderEvents(){
    $('evCount').textContent=(D.events||[]).length+' 件';
    $('eventList').innerHTML=(D.events||[]).map(e=>
      '<div class="ev"><span class="ev-year">'+e.year+'</span><div class="ev-body">'
      +'<div class="ev-title">'+e.title
      +'<span class="ev-term '+(e.dir||'neutral')+'">'+e.term+'</span></div>'
      +'<div class="ev-desc">'+e.desc+'</div>'
      +(e.quote ? '<div class="ev-quote">'+e.quote+'</div>' : '')
      +'</div></div>').join('');
  }

  function mount(data){
    D=data;
    const f=D.figure;
    document.title='人物行情 · '+f.name+' | DYNASTY EXCHANGE';
    years=KLINE.yearsOf(f.startYear, f.endYear);
    candles=KLINE.buildCandles({start:f.startYear,end:f.endYear,peak:f.peakYear,
                            seed:f.seed,anchors:D.anchors,events:D.events});
    yearIndex={}; years.forEach((y,i)=>yearIndex[y]=i);
    $('chartPending').style.display='none';
    renderHeader(); renderChart(); renderPeriods(); renderEvents();
  }

  function showPending(f){
    $('fName').textContent=f.name; $('fCode').textContent=f.code;
    $('fAlias').textContent=[f.alias,f.role].filter(Boolean).join(' · ');
    $('fSummary').textContent='该人物数据筹备中，暂无可生成的 K 线。';
    $('fPrice').textContent='—'; $('fChg').textContent='数据筹备中';
    $('chart').style.display='none';
    $('chartPending').style.display='';
  }

  $('btnYear').onclick=()=>{ mode='year'; renderChart(); };
  $('btnPeriod').onclick=()=>{ mode='period'; renderChart(); };
  window.addEventListener('resize',()=>{ if(chart) chart.resize(); });

  // ---------- 自选（localStorage 持久化；自选板块页共用这两个 key） ----------
  const FAV_KEY='figure.watchlist';
  function loadFavs(){
    try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]')); }
    catch(e){ return new Set(); }
  }
  function saveFavs(set){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(set))); }catch(e){}
  }
  const favSet=loadFavs();
  function syncFavBtn(){
    const b=$('favBtn'); if(!b || !D) return;
    const on=favSet.has(D.figure.code);
    b.textContent = on ? '已加自选' : '加入自选';
    b.classList.toggle('faved', on);
  }
  $('favBtn').addEventListener('click',()=>{
    if(!D) return;
    const code=D.figure.code;
    if(favSet.has(code)) favSet.delete(code); else favSet.add(code);
    saveFavs(favSet);
    syncFavBtn();
  });

  // ---------- 人物切换：chips / 键盘 ←→ / 两侧箭头 统一走 selectFigure ----------
  let apiRef=null, curCode=null, FIGS=[];   // FIGS: [{code,name,dynastyCode,isActive,hasData}]
  const DYN_FALLBACK={ 'TANG.618':'唐朝', 'DASONG.960':'宋朝' };

  const renderSwitch=(active)=>{
    const box=document.getElementById('figSwitch');
    if(!box) return;
    box.innerHTML='';
    let lastDyn=null;
    FIGS.forEach(f=>{
      if(f.dynastyCode && f.dynastyCode!==lastDyn){   // 朝代板块分隔标签
        lastDyn=f.dynastyCode;
        const tag=document.createElement('span');
        tag.className='fig-chip fig-dyn';
        tag.textContent=DYN_FALLBACK[f.dynastyCode]||f.dynastyCode;
        box.appendChild(tag);
      }
      const b=document.createElement('button');
      b.className='fig-chip'+(f.code===active?' active':'');
      b.innerHTML=f.name+'<em>'+f.code+'</em>';
      if(!f.hasData) b.style.opacity='.45';
      b.onclick=()=>{ if(f.hasData) selectFigure(f.code); };
      box.appendChild(b);
    });
  };

  async function fetchFigure(code){
    if(apiRef){
      const full=JSON.parse(await apiRef.get_figure(code));
      if(!full.error && full.anchors && full.anchors.length>=2) return full;
      return null;
    }
    const all=window.FIGURE_DATA||{};
    return all[code] || null;
  }

  // 同页切换：不重载页面，只重取数据重绘（hash 同步深链，便于分享/刷新定位）
  async function selectFigure(code){
    if(!code || code===curCode) return;
    const meta=FIGS.find(f=>f.code===code);
    if(meta && !meta.hasData){ showPending(meta); curCode=code; return; }
    const full=await fetchFigure(code);
    if(!full){ if(meta) showPending(meta); return; }
    curCode=code;
    document.getElementById('chart').style.display='';
    mode='year';
    mount(full);
    renderSwitch(code);
    syncFavBtn();
    if(decodeURIComponent((location.hash||'').replace('#',''))!==code){
      location.hash='#'+code;
    }
  }

  function stepTo(dir){
    const tradable=FIGS.filter(f=>f.hasData);
    if(!tradable.length) return;
    const i=tradable.findIndex(f=>f.code===curCode);
    const j=(Math.max(i,0)+dir+tradable.length)%tradable.length;
    if(tradable[j].code!==curCode) selectFigure(tradable[j].code);
  }

  // 键盘 ←/→（焦点在输入控件时忽略）
  document.addEventListener('keydown',ev=>{
    if(ev.key!=='ArrowLeft' && ev.key!=='ArrowRight') return;
    const tag=(document.activeElement && document.activeElement.tagName)||'';
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
    stepTo(ev.key==='ArrowLeft' ? -1 : 1);
  });
  // 同页 hash 变化（外部改链深链到另一人物）也要响应
  window.addEventListener('hashchange',()=>{
    const c=decodeURIComponent((location.hash||'').replace('#',''));
    if(c && c!==curCode) selectFigure(c);
  });

  (async function(){
    apiRef=await waitForApi(2500);
    const want=decodeURIComponent((location.hash||'').replace('#',''));

    if(!apiRef){
      // file:// 演示回退：figure_data.js 含全部人物完整盘面
      const all=window.FIGURE_DATA||{};
      const codes=Object.keys(all).sort((a,b)=>
        (all[a].figure.startYear||0)-(all[b].figure.startYear||0));
      FIGS=codes.map(c=>({code:c,name:all[c].figure.name,
        dynastyCode:all[c].figure.dynastyCode||'',isActive:true,hasData:true}));
      showArrows();
      if(FIGS.length){
        const pick = (want && all[want]) ? want : FIGS[0].code;
        const full=all[pick];
        curCode=pick; mount(full); renderSwitch(pick); syncFavBtn();
      } else {
        showPending({name:'—',code:'—',alias:'',role:''});
      }
      return;
    }

    const list=JSON.parse(await apiRef.list_figures());
    if(!list.length){ showPending({name:'人物板块',code:'—',alias:'即将上线',role:''}); return; }
    FIGS=list;
    showArrows();
    const pick=list.find(x=>x.code===want && x.hasData)
             || list.find(x=>x.code===want)
             || list.find(x=>x.isActive && x.hasData)
             || list.find(x=>x.hasData)
             || list[0];
    const full=await fetchFigure(pick.code);
    if(!full){ showPending(pick); curCode=pick.code; renderSwitch(pick.code); return; }
    curCode=pick.code; mount(full); renderSwitch(pick.code); syncFavBtn();
  })();

  function showArrows(){
    if(FIGS.filter(f=>f.hasData).length<2) return;   // 单个标的时不显示箭头
    const np=document.getElementById('navPrev'), nn=document.getElementById('navNext');
    if(!np || !nn) return;
    np.style.display=''; nn.style.display='';
    np.onclick=()=>stepTo(-1);
    nn.onclick=()=>stepTo(1);
  }
})();
</script>
</body>
</html>
