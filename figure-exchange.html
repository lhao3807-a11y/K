  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .figure-card { animation:none; } }

  .status-tag { border-radius:6px; padding:4px 8px; font-size:11px; font-weight:500; }

  .card-price { display:flex; align-items:baseline; gap:10px; }

  .pending { padding:80px 0; text-align:center; color:var(--text-3); font-size:14px; }

<script>
(function(){
  const KLINE = window.KLINE;
  const UP='#F6465D', DOWN='#2EBD85';
  const $ = id => document.getElementById(id);
  const fmtPct = x => (x>=0?'+':'') + x.toFixed(2) + '%';

  // file:// 回退时无 list_dynasties，用静态映射兜底（新王朝挂牌后以 API 名称为准）
  const DYN_FALLBACK = { 'TANG.618':'唐朝', 'DASONG.960':'宋朝' };

  function waitForApi(timeout){
    return new Promise(res=>{
      const t0=Date.now();
      (function check(){
        if(window.pywebview && window.pywebview.api) return res(window.pywebview.api);
        if(Date.now()-t0>timeout) return res(null);
        setTimeout(check,80);
      })();
    });
  }

  function miniKlineSVG(cs, up){
    const W=306, H=52;
    const pts=cs.map(k=>k[1]);
    let lo=Math.min.apply(null,pts), hi=Math.max.apply(null,pts);
    if(hi===lo) hi=lo+1;
    const col=up?UP:DOWN, n=pts.length, coords=[];
    for(let i=0;i<n;i++){
      coords.push([(2+i*(W-6)/(n-1)).toFixed(1), (H-4-(pts[i]-lo)/(hi-lo)*(H-10)).toFixed(1)]);
    }
    const poly=coords.map(c=>c[0]+','+c[1]).join(' ');
    const area='M'+coords.map(c=>c[0]+' '+c[1]).join(' L')
      +' L'+coords[n-1][0]+' '+H+' L'+coords[0][0]+' '+H+' Z';
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" fill="none" xmlns="http://www.w3.org/2000/svg">'
      +'<path d="'+area+'" fill="'+col+'" fill-opacity="0.08"/>'
      +'<polyline points="'+poly+'" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  function cardHTML(f, st, i){
    const c = st.chg>=0 ? 'up' : 'down';
    const dur = f.endYear-f.startYear+1;
    const delay=' style="animation-delay:'+((i||0)*60)+'ms"';
    return '<div class="figure-card" data-code="'+f.code+'"'+delay+'>'
      +'<div class="card-head"><div class="card-name-group">'
      +'<span class="card-name">'+f.name+'</span>'
      +(f.alias?'<span class="card-alias">'+f.alias+'</span>':'')
      +'<span class="card-meta">'+f.code+' · '+f.startYear+'—'+f.endYear+' · 存续'+dur+'年</span></div>'
      +'<span class="status-tag '+c+'">'+(c==='up'?'上涨':'下跌')+'</span></div>'
      +'<div class="card-price"><span class="card-price-num '+c+'">'+st.last.toFixed(2)+'</span>'
      +'<span class="card-price-chg '+c+'">'+fmtPct(st.chg)+'</span></div>'
      +'<div class="card-spark">'+miniKlineSVG(st.sample, st.chg>=0)+'</div>'
      +(f.summary?'<div class="card-summary">'+f.summary+'</div>':'')
      +'</div>';
  }

  // rows: [{code,name,...,dynastyCode}]；fullMap: code -> 完整盘面（figure/anchors/events）
  function renderBlocks(rows, fullMap, dynNames){
    const tradable = rows.filter(f=>f.hasData && fullMap[f.code]);
    const groups=[];   // [{code,name,items:[{f,st}]}] 按王朝起始年排序
    const indexOf={};
    tradable.forEach(f=>{
      const dc=f.dynastyCode||'';
      if(indexOf[dc]==null){
        indexOf[dc]=groups.length;
        groups.push({code:dc, name:dynNames[dc]||'其他板块', items:[]});
      }
      groups[indexOf[dc]].items.push(f);
    });
    groups.sort((a,b)=>{
      const ya=(fullMap[a.items[0].code].figure||{}).startYear||0;
      const yb=(fullMap[b.items[0].code].figure||{}).startYear||0;
      return ya-yb;
    });

    let up=0, down=0, i=0, html='';
    groups.forEach(g=>{
      html+='<section class="block" id="block-'+g.code+'">'
        +'<div class="block-head"><div>'
        +'<span class="block-title">'+g.name+'<em>'+g.code+'</em></span>'
        +'</div><span class="block-sub">'+g.items.length+' 位挂牌人物 · 点击查看个人盘面</span></div>'
        +'<div class="card-grid">';
      g.items.forEach(f=>{
        const full=fullMap[f.code];
        const years=KLINE.yearsOf(full.figure.startYear, full.figure.endYear);
        const candles=KLINE.buildCandles({start:full.figure.startYear,end:full.figure.endYear,
          peak:full.figure.peakYear,seed:full.figure.seed,anchors:full.anchors,events:full.events});
        const st=KLINE.stats(candles, full.figure.issuePrice||100);
        if(st.chg>=0) up++; else down++;
        // 卡片迷你线取尾段 24 根，与王朝卡片口径一致
        st.sample=candles.slice(-24);
        html+=cardHTML({code:f.code,name:f.name,alias:f.alias,startYear:full.figure.startYear,
                        endYear:full.figure.endYear,summary:full.figure.summary}, st, i++);
      });
      html+='</div></section>';
    });

    $('blocks').innerHTML=html || '<div class="pending">暂无挂牌人物，数据入库后自动展示。</div>';
    $('mListed').textContent=tradable.length+' 位';
    $('mBlocks').textContent=groups.length+' 个';
    $('mUp').textContent=up;
    $('mDown').textContent=down;
    document.querySelectorAll('.figure-card').forEach(el=>{
      el.addEventListener('click',()=>{ location.href='./figure.html#'+el.dataset.code; });
    });
  }

  (async function(){
    const api=await waitForApi(2500);
    if(!api){
      // file:// 演示回退：figure_data.js 已含全部人物的完整盘面
      const all=window.FIGURE_DATA||{};
      const rows=Object.keys(all).map(c=>{
        const fg=all[c].figure;
        return {code:c, name:fg.name, dynastyCode:fg.dynastyCode||'', hasData:true};
      }).sort((a,b)=>(all[a.code].figure.startYear||0)-(all[b.code].figure.startYear||0));
      const dynNames={};
      rows.forEach(f=>{ dynNames[f.dynastyCode]=DYN_FALLBACK[f.dynastyCode]||'其他板块'; });
      $('pending').style.display='none';
      renderBlocks(rows, all, dynNames);
      return;
    }
    const list=JSON.parse(await api.list_figures());
    // 王朝名称映射（code -> 名称）
    let dynNames={};
    try{
      dynNames={};
      JSON.parse(await api.list_dynasties()).forEach(d=>{ dynNames[d.code]=d.name; });
    }catch(e){ dynNames={}; }
    // 逐个拉取完整盘面（并行）
    const fullMap={};
    await Promise.all(list.filter(f=>f.hasData).map(async f=>{
      try{
        const d=JSON.parse(await api.get_figure(f.code));
        if(d && d.anchors && d.anchors.length>=2) fullMap[f.code]=d;
      }catch(e){ /* 单人失败不阻塞整页 */ }
    }));
    $('pending').style.display='none';
    renderBlocks(list, fullMap, dynNames);
  })();
})();
</script>
