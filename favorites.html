<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自选 · DYNASTY EXCHANGE</title>
<style>
  :root {
    --bg:#FFFFFF; --bg-alt:#F5F5F7; --band:#272729;
    --text:#1D1D1F; --text-2:#6E6E73; --text-3:#86868B;
    --axis:#C7CDD6; --blue:#0066CC; --blue-hover:#0077ED;
    --up:#F6465D; --down:#2EBD85; --line:#E0E0E0; --grid:#F0F0F0;
    --font-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;
    --font-num:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:var(--bg); }
  body { font-family:var(--font-cn); color:var(--text); -webkit-font-smoothing:antialiased; }
  .up { color:var(--up); } .down { color:var(--down); }

  .nav { display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 32px; background:#000; }
  .logo-group { display:flex; align-items:center; gap:10px; }
  .logo-cn { font-size:14px; font-weight:600; color:#FFF; line-height:1.2; }
  .logo-en { font-family:var(--font-num); font-size:8px; color:#7A7A7A; letter-spacing:2px; }
  .nav-links { display:flex; align-items:center; gap:28px; }
  .nav-link { font-size:12px; color:#999; cursor:pointer; user-select:none; text-decoration:none; }
  .nav-link:hover { color:#FFF; }
  .nav-link.active { color:#FFF; font-weight:500; }
  .nav-right { display:flex; align-items:center; gap:16px; }
  .market-status { display:flex; align-items:center; gap:6px; }
  .status-dot { width:8px; height:8px; border-radius:99px; background:var(--down); }
  .status-text { font-size:12px; font-weight:500; color:var(--down); }

  .wrap { max-width:1180px; margin:0 auto; padding:0 32px; }

  .hero { padding:56px 0 30px; display:flex; align-items:flex-end; justify-content:space-between; gap:32px; }
  .hero-eyebrow { font-family:var(--font-num); font-size:13px; font-weight:500; color:var(--blue); letter-spacing:2px; }
  .hero-title { font-size:44px; font-weight:600; letter-spacing:-1px; margin-top:12px; }
  .hero-lead { font-size:15px; color:var(--text-2); margin-top:10px; line-height:24px; max-width:640px; }
  .clear-btn { flex:none; background:#FFF; border:1px solid var(--line); border-radius:9999px; padding:9px 20px;
               font-size:13px; font-family:var(--font-cn); color:var(--text-2); cursor:pointer; transition:all .15s; }
  .clear-btn:hover { border-color:var(--up); color:var(--up); }

  .summary { display:flex; align-items:center; background:var(--band); border-radius:16px; padding:20px 8px; margin-bottom:48px; }
  .metric { flex:1; display:flex; flex-direction:column; gap:6px; align-items:center; }
  .metric-label { font-size:12px; color:#86868B; }
  .metric-num { font-family:var(--font-num); font-size:22px; font-weight:600; color:#FFF; }
  .metric-num.up { color:var(--up); } .metric-num.down { color:var(--down); }
  .summary-divider { width:1px; height:32px; background:rgba(255,255,255,.12); }

  .block { margin-bottom:52px; }
  .block-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;
                padding-bottom:14px; border-bottom:1px solid var(--line); }
  .block-title { font-size:22px; font-weight:600; letter-spacing:-0.3px; }
  .block-title em { font-style:normal; font-family:var(--font-num); font-size:13px; color:var(--text-3); margin-left:10px; }
  .block-sub { font-size:12px; color:var(--text-3); }

  .card-grid { display:flex; flex-wrap:wrap; gap:20px; }
  .fav-card {
    position:relative; width:352px; display:flex; flex-direction:column; gap:14px;
    background:#FFF; border:1px solid var(--line); border-radius:18px; padding:22px;
    cursor:pointer; transition:transform .15s ease, border-color .15s ease;
    animation:rise .5s cubic-bezier(.22,.61,.36,1) both;
  }
  .fav-card:hover { transform:translateY(-2px); border-color:var(--blue); }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .fav-card { animation:none; } }
  .card-head { display:flex; align-items:flex-start; justify-content:space-between; }
  .card-name-group { display:flex; flex-direction:column; gap:4px; }
  .card-name { font-size:18px; font-weight:600; }
  .card-meta { font-family:var(--font-num); font-size:12px; color:var(--text-3); }
  .status-tag { border-radius:6px; padding:4px 8px; font-size:11px; font-weight:500; flex:none; }
  .status-tag.up { background:rgba(246,70,93,.1); color:var(--up); }
  .status-tag.down { background:rgba(46,189,133,.1); color:var(--down); }
  .card-price { display:flex; align-items:baseline; gap:10px; }
  .card-price-num { font-family:var(--font-num); font-size:24px; font-weight:600; }
  .card-price-chg { font-family:var(--font-num); font-size:13px; font-weight:500; }
  .card-spark svg { display:block; }
  .rm-btn { position:absolute; right:16px; bottom:16px; background:none; border:none; cursor:pointer;
            font-size:12px; font-family:var(--font-cn); color:var(--text-3); padding:2px 4px; }
  .rm-btn:hover { color:var(--up); text-decoration:underline; }
  .block-empty { padding:36px 0; font-size:14px; color:var(--text-3); }
  .block-empty a { color:var(--blue); text-decoration:none; }
  .footer { display:flex; align-items:center; justify-content:space-between; padding:36px 0 48px; border-top:1px solid var(--line); }
  .footer p { font-size:12px; color:var(--text-3); }
  .back-link { font-size:13px; color:var(--blue); cursor:pointer; text-decoration:none; }
</style>
</head>
<body>
  <header class="nav">
    <div class="logo-group">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect width="26" height="26" rx="7" fill="#0066CC"/><line x1="9" y1="5" x2="9" y2="21" stroke="#FFF" stroke-width="1.5"/><rect x="7" y="9" width="4" height="8" rx="1" fill="#FFF"/><line x1="17" y1="7" x2="17" y2="23" stroke="#FFF" stroke-width="1.5"/><rect x="15" y="12" width="4" height="7" rx="1" fill="#FFF"/></svg>
      <div><div class="logo-cn">王朝交易所</div><div class="logo-en">DYNASTY EXCHANGE</div></div>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="./dynasty-exchange.html">王朝</a>
      <a class="nav-link" href="./figure-exchange.html">人物</a>
      <a class="nav-link active" id="navFav">自选</a>
      <a class="nav-link" href="./dynasty-exchange.html#featured">数据</a>
      <a class="nav-link" href="./dynasty-exchange.html#teaser">关于</a>
    </nav>
    <div class="nav-right">
      <div class="market-status"><div class="status-dot"></div><span class="status-text">交易中</span></div>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <div>
        <div class="hero-eyebrow">WATCHLIST · 跨板块自选</div>
        <h1 class="hero-title">自选</h1>
        <p class="hero-lead">王朝与人物共用一份自选清单：任一盘面页点「加入自选」，标的即汇总到这里，跨板块统一盯盘。</p>
      </div>
      <button class="clear-btn" id="clearAll">清空自选</button>
    </section>

    <section class="summary">
      <div class="metric"><div class="metric-label">自选总数</div><div class="metric-num" id="mTotal">--</div></div>
      <div class="summary-divider"></div>
      <div class="metric"><div class="metric-label">王朝标的</div><div class="metric-num" id="mDyn">--</div></div>
      <div class="summary-divider"></div>
      <div class="metric"><div class="metric-label">人物标的</div><div class="metric-num" id="mFig">--</div></div>
      <div class="summary-divider"></div>
      <div class="metric"><div class="metric-label">上涨 / 下跌</div><div class="metric-num" id="mUD">--</div></div>
    </section>

    <section class="block" id="blockDyn">
      <div class="block-head">
        <span class="block-title">王朝<b style="display:none">·</b><em id="dynCount"></em></span>
        <span class="block-sub">点击卡片进入王朝盘面</span>
      </div>
      <div class="card-grid" id="dynGrid"></div>
    </section>

    <section class="block" id="blockFig">
      <div class="block-head">
        <span class="block-title">人物<em id="figCount"></em></span>
        <span class="block-sub">点击卡片进入个人盘面</span>
      </div>
      <div class="card-grid" id="figGrid"></div>
    </section>

    <footer class="footer">
      <p>王朝交易所 DYNASTY EXCHANGE V1.4.1 · 自选板块 · 行情为历史演绎，不构成投资建议</p>
      <a class="back-link" href="./dynasty-exchange.html">← 返回王朝交易所</a>
    </footer>
  </div>

<script src="./kline.js"></script>
<script src="./data.js"></script>
<script src="./figure_data.js"></script>
<script>
(function(){
  const KLINE = window.KLINE;
  const UP='#F6465D', DOWN='#2EBD85';
  const $ = id => document.getElementById(id);
  const fmtPct = x => (x>=0?'+':'') + x.toFixed(2) + '%';
  const FAV_DYN='dynasty.watchlist', FAV_FIG='figure.watchlist';

  function loadList(key){
    try{ return new Set(JSON.parse(localStorage.getItem(key)||'[]')); }
    catch(e){ return new Set(); }
  }
  function saveList(key, set){
    try{ localStorage.setItem(key, JSON.stringify(Array.from(set))); }catch(e){}
  }

  function waitForApi(timeout){
    return new Promise(res=>{
      const t0=Date.now();
      (function check(){
        if(window.pywebview && window.pywebview.api) return res(window.pywebview.api);
        if(Date.now()-t0>timeout) return res(null);
        setTimeout(check,80);
      })();
    });
  }

  function miniKlineSVG(cs, up){
    const W=306, H=52;
    const pts=cs.map(k=>k[1]);
    let lo=Math.min.apply(null,pts), hi=Math.max.apply(null,pts);
    if(hi===lo) hi=lo+1;
    const col=up?UP:DOWN, n=pts.length, coords=[];
    for(let i=0;i<n;i++){
      coords.push([(2+i*(W-6)/(n-1)).toFixed(1), (H-4-(pts[i]-lo)/(hi-lo)*(H-10)).toFixed(1)]);
    }
    const poly=coords.map(c=>c[0]+','+c[1]).join(' ');
    const area='M'+coords.map(c=>c[0]+' '+c[1]).join(' L')
      +' L'+coords[n-1][0]+' '+H+' L'+coords[0][0]+' '+H+' Z';
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" fill="none" xmlns="http://www.w3.org/2000/svg">'
      +'<path d="'+area+'" fill="'+col+'" fill-opacity="0.08"/>'
      +'<polyline points="'+poly+'" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  // kind: 'dyn' | 'fig'；item 为列表行，full 为完整盘面（含 anchors/events）
  function favCard(kind, item, full, i){
    const last = full.candles[full.candles.length-1][1];
    const c = full.st.chg>=0 ? 'up' : 'down';
    const dur = item.endYear-item.startYear+1;
    const href = kind==='dyn' ? './index.html#' : './figure.html#';
    return '<div class="fav-card" data-code="'+item.code+'" data-kind="'+kind+'"'
      +' data-href="'+href+'" style="animation-delay:'+((i||0)*60)+'ms">'
      +'<div class="card-head"><div class="card-name-group">'
      +'<span class="card-name">'+item.name+'</span>'
      +'<span class="card-meta">'+item.code+' · '+item.startYear+'—'+item.endYear+' · 存续'+dur+'年</span></div>'
      +'<span class="status-tag '+c+'">'+(c==='up'?'上涨':'下跌')+'</span></div>'
      +'<div class="card-price"><span class="card-price-num '+c+'">'+last.toFixed(2)+'</span>'
      +'<span class="card-price-chg '+c+'">'+fmtPct(full.st.chg)+'</span></div>'
      +'<div class="card-spark">'+miniKlineSVG(full.candles.slice(-24), full.st.chg>=0)+'</div>'
      +'<button class="rm-btn" data-rm="'+item.code+'" data-kind="'+kind+'">移除自选</button>'
      +'</div>';
  }

  function tradeStats(list, fullMap){
    let up=0, down=0, rows=[];
    list.forEach(f=>{
      const full=fullMap[f.code];
      if(!full) return;
      rows.push({item:f, full:full});
      if(full.st.chg>=0) up++; else down++;
    });
    return {rows:rows, up:up, down:down};
  }

  function updateCounts(dynN, figN, upN, totalN){
    $('dynCount').textContent = dynN ? dynN+' 支持仓' : '';
    $('figCount').textContent = figN ? figN+' 位持仓' : '';
    $('mDyn').textContent = dynN;
    $('mFig').textContent = figN;
    $('mTotal').textContent = dynN+figN;
    $('mUD').textContent = totalN ? (upN+' / '+(totalN-upN)) : '0 / 0';
  }

  // ---------- 数据装载：程序内走 js_api；浏览器直开用 data.js / figure_data.js 兜底 ----------
  (async function(){
    const api=await waitForApi(2500);
    const dynFav=loadList(FAV_DYN), figFav=loadList(FAV_FIG);

    // 每个自选标的的完整盘面 + 现价/涨跌（与盘面页同算法）
    function packFigure(d){
      const f=d.figure;
      const years=KLINE.yearsOf(f.startYear, f.endYear);
      const candles=KLINE.buildCandles({start:f.startYear,end:f.endYear,peak:f.peakYear,
        seed:f.seed,anchors:d.anchors,events:d.events});
      return {st:KLINE.stats(candles, f.issuePrice||100), candles:candles};
    }
    function packDynasty(d){
      const f=d.dynasty;
      const candles=KLINE.buildCandles({start:f.startYear,end:f.endYear,peak:f.peakYear,
        seed:f.seed,anchors:d.anchors,events:d.events});
      return {st:KLINE.stats(candles, f.issuePrice||100), candles:candles};
    }

    let dynRows=[], figRows=[];
    if(api){
      const dynList=JSON.parse(await api.list_dynasties());
      const figList=JSON.parse(await api.list_figures());
      const dynMeta=dynList.filter(d=>dynFav.has(d.code));
      const figMeta=figList.filter(f=>figFav.has(f.code));
      const dynFull={}, figFull={};
      await Promise.all([
        ...dynMeta.map(async d=>{
          try{ const j=JSON.parse(await api.get_dynasty(d.code));
               if(j && j.anchors && j.anchors.length>=2) dynFull[d.code]=packDynasty(j); }catch(e){}
        }),
        ...figMeta.map(async f=>{
          try{ const j=JSON.parse(await api.get_figure(f.code));
               if(j && j.anchors && j.anchors.length>=2) figFull[f.code]=packFigure(j); }catch(e){}
        })
      ]);
      dynRows=tradeStats(dynMeta, dynFull).rows;
      figRows=tradeStats(figMeta, figFull).rows;
    }else{
      // 浏览器演示：人物回退完整，王朝回退仅 data.js 中那一支
      const fd=window.FIGURE_DATA||{};
      figRows=Object.keys(fd).filter(c=>figFav.has(c))
        .map(c=>({item:{code:c,name:fd[c].figure.name,startYear:fd[c].figure.startYear,
                        endYear:fd[c].figure.endYear}, full:packFigure(fd[c])}));
      const dd=window.DYNASTY_DATA;
      if(dd && dd.dynasty && dynFav.has(dd.dynasty.code)){
        dynRows=[{item:{code:dd.dynasty.code,name:dd.dynasty.name,
                        startYear:dd.dynasty.startYear,endYear:dd.dynasty.endYear},
                  full:packDynasty(dd)}];
      }
    }

    updateCounts(dynRows.length, figRows.length,
      dynRows.concat(figRows).filter(r=>r.full.st.chg>=0).length,
      dynRows.length+figRows.length);

    const emptyDyn='<div class="block-empty">还没有自选王朝标的 —— 去 <a href="./dynasty-exchange.html">王朝交易所</a> 挑几支。</div>';
    const emptyFig='<div class="block-empty">还没有自选人物标的 —— 去 <a href="./figure-exchange.html">人物交易所</a> 挑几位。</div>';
    $('dynGrid').innerHTML = dynRows.length
      ? dynRows.map((r,i)=>favCard('dyn', r.item, r.full, i)).join('') : emptyDyn;
    $('figGrid').innerHTML = figRows.length
      ? figRows.map((r,i)=>favCard('fig', r.item, r.full, i)).join('') : emptyFig;

    // 卡片点击进盘面；「移除自选」就地摘除并重绘
    document.querySelectorAll('.fav-card').forEach(el=>{
      el.addEventListener('click',ev=>{
        if(ev.target.closest('.rm-btn')) return;
        location.href=el.dataset.href+el.dataset.code;
      });
    });
    document.querySelectorAll('.rm-btn').forEach(b=>{
      b.addEventListener('click',ev=>{
        ev.stopPropagation();
        const key = b.dataset.kind==='dyn' ? FAV_DYN : FAV_FIG;
        const set = loadList(key);
        set.delete(b.dataset.rm);
        saveList(key, set);
        location.reload();
      });
    });

    $('clearAll').addEventListener('click',()=>{
      if(!confirm('确定清空全部自选（王朝 + 人物）？')) return;
      saveList(FAV_DYN, new Set());
      saveList(FAV_FIG, new Set());
      location.reload();
    });
  })();
})();
</script>
</body>
</html>
